# =============================================================================
# Deploy n8n workflows
# =============================================================================
# The repository is the source of truth for workflow definitions. On any push to
# main that touches automation/n8n/, the definitions here are pushed to the n8n
# instance and activated.
#
# Pull requests get a dry run only: a PR from a fork must never be able to
# reach a production instance, and seeing what *would* change is the useful part
# of a review anyway.
# =============================================================================

name: Deploy n8n workflows

on:
  push:
    branches: [main]
    paths:
      - "automation/n8n/**"
      - ".github/workflows/deploy-n8n.yml"
  pull_request:
    paths:
      - "automation/n8n/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Sync workflows to n8n
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate workflow JSON
        # Cheap and runs everywhere, including on forks with no secrets. A
        # malformed file should fail here rather than half-way through a deploy.
        run: |
          for f in automation/n8n/workflows/*.json; do
            python3 -c "import json,sys; d=json.load(open('$f')); assert 'name' in d and 'nodes' in d, '$f missing name or nodes'"
            echo "✔ $f"
          done

      - name: Dry run (pull requests)
        if: github.event_name == 'pull_request'
        run: echo "Pull request — showing intended changes only, not deploying."

      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: python3 automation/n8n/deploy.py
