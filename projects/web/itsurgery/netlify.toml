# Netlify configuration for the IT Surgery website.
#
# In the Netlify site settings set "Base directory" to:
#   projects/web/itsurgery
# Netlify then reads this file from that base and runs the Eleventy build.

[build]
  command = "npm run build"
  publish = "_site"
  # Netlify does not discover functions unless the directory is declared.
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Security headers for a static marketing site. The Content-Security-Policy is
# NOT here: it carries per-build hashes of the inline scripts, so Eleventy
# writes it to _site/_headers at build time (see eleventy.config.cjs). Netlify
# merges that file with the headers below.
[[headers]]
  for = "/*"
  [headers.values]
    # Kept alongside CSP frame-ancestors for browsers that predate CSP 2.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The site asks for none of these. Denying them up front means a
    # compromised or mistaken script cannot ask for them either. "payment" is
    # the browser Payment Request API (Apple/Google Pay buttons on a page) -
    # payments today happen on Stripe's own site after a redirect, so nothing
    # here uses it, but it stays allowed for this origin and the Cal.com frame
    # so an in-page payment could be added later without a header change.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), interest-cohort=(), payment=(self \"https://app.cal.com\")"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Netlify sends a one-year HSTS by default; includeSubDomains extends it to
    # crm., n8n. and every other itsurgery.me host, all of which are HTTPS-only
    # (Darren, 2026-09-05). No "preload": that is a browser-registry commitment
    # that cannot be undone quickly.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Font files carry their version in the filename, so they never change in
# place and can be cached for a year.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify serves .webmanifest as application/octet-stream. Because
# X-Content-Type-Options: nosniff is set above, the browser will not fall back
# to sniffing, so the manifest has to be given its correct type explicitly.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=604800"

# Icons change rarely and are content-stable; a week is safe.
[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# NOTE: /book is a real page now (src/book.njk) with the Bookings calendar
# embedded, so there is no redirect here. There used to be one, with
# force = true, which shadowed the page completely — Netlify applies forced
# redirects ahead of static files, so the page was built and deployed but
# never served. If a redirect is ever reinstated, it must not cover /book.
