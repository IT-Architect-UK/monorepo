# Netlify configuration for the IT Surgery website.
#
# In the Netlify site settings set "Base directory" to:
#   projects/web/itsurgery
# Netlify then reads this file from that base and runs the Eleventy build.

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Sensible security headers for a static marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Netlify serves .webmanifest as application/octet-stream. Because
# X-Content-Type-Options: nosniff is set above, the browser will not fall back
# to sniffing, so the manifest has to be given its correct type explicitly.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=604800"

# Icons change rarely and are content-stable; a week is safe.
[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
