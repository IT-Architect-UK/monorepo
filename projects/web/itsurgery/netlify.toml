# Netlify configuration for the IT Surgery website.
#
# In the Netlify site settings set "Base directory" to:
#   projects/web/itsurgery
# Netlify then reads this file from that base and runs the Eleventy build.

[build]
  command = "npm run build"
  publish = "_site"
  # Netlify does not discover functions unless the directory is declared.
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Sensible security headers for a static marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Netlify serves .webmanifest as application/octet-stream. Because
# X-Content-Type-Options: nosniff is set above, the browser will not fall back
# to sniffing, so the manifest has to be given its correct type explicitly.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=604800"

# Icons change rarely and are content-stable; a week is safe.
[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Vanity booking link. Microsoft Bookings mints its URL from the tenant's
# default domain, which is it-architect.uk — a different brand, and one we
# deliberately keep separate from IT Surgery. Customers should never see it.
#
# 302 rather than 301 on purpose: if the Bookings mailbox is ever moved to
# @itsurgery.me the target changes, and a 301 would already be cached in
# customers' browsers with no way to recall it.
[[redirects]]
  from = "/book"
  to = "https://outlook.office.com/book/ITSurgery@it-architect.uk/"
  status = 302
  force = true

[[redirects]]
  from = "/book/*"
  to = "https://outlook.office.com/book/ITSurgery@it-architect.uk/"
  status = 302
  force = true
