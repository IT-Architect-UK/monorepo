---
# =============================================================================
# group_vars/n8n — non-secret settings for the n8n host
# =============================================================================
# Secrets (n8n_encryption_key, n8n_db_password) live in vault.yml alongside
# this file. See roles/n8n/README.md.
# =============================================================================

# Cal.com's webhook and the itsurgery.me booking page both call n8n by this
# name. Changing it later means re-registering every external caller, so treat
# it as permanent.
n8n_domain: "n8n.itsurgery.me"
n8n_dashboard_domain: "dashboard.itsurgery.me"

# Webmin's own hostname. Named for the box it administers rather than
# something generic, because there will be more than one server eventually and
# "which admin panel is this" is a question worth never having to ask.
webmin_domain: "webmin-crm-vps1.itsurgery.me"

# Microsoft sign-in for the admin pages. Off until the Entra app registration
# exists and its secrets are in the vault — flipping this on without them
# fails the deploy loudly rather than locking anyone out quietly.
oauth2_proxy_enabled: true
# The same tenant as the n8n mail app registration.
oauth2_proxy_tenant_id: "0f8703ae-7d51-4894-b66e-75f73e64a903"
