---
# =============================================================================
# group_vars/espocrm.yml — hosts running the CRM
# =============================================================================
# Non-secret settings only. The three passwords live in espocrm_vault.yml,
# encrypted with Ansible Vault — see roles/espocrm/README.md.
# =============================================================================

espocrm_domain: "crm.itsurgery.me"

# Not "admin". Automated attacks assume the default, and EspoCRM exposes a
# public login page. Matches the it-admin convention used elsewhere in the repo.
#
# NOTE: this is a ONE-TIME install variable in the EspoCRM image - it creates
# the account on first run and is ignored afterwards. Changing it later means
# editing the user inside EspoCRM, not re-running this playbook.
espocrm_admin_username: "it-admin"
letsencrypt_email: "darren.pilkington@it-architect.uk"

# Pinned deliberately. Bump when you intend to upgrade, having taken a backup
# first, then re-run with -e espocrm_pull_policy=always
espocrm_image_tag: "9.2.4"
espocrm_mariadb_tag: "11.4"

# 02:30 local, so the dump has finished before Restic ships it off-box.
espocrm_backup_schedule: "*-*-* 02:30:00"
espocrm_local_backup_keep_days: 7

# The espocrm role owns the firewall on this host. The common role's baseline
# ruleset opens SSH to the entire internet, and because rules are additive that
# permissive rule would sit alongside the source restriction and defeat it.
baseline_firewall: false
