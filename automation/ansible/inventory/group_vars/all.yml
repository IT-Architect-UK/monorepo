---
# Then paste the encrypted block where the value should be.
# =============================================================================

# ── Admin user ────────────────────────────────────────────────────────────
admin_user: sysadmin
admin_groups:
  - sudo
  - docker    # Include only if Docker is installed

# ── SSH hardening ─────────────────────────────────────────────────────────
ssh_port: 22                          # Change to a non-standard port for production
ssh_permit_root_login: "no"           # Never allow root SSH login
ssh_password_authentication: "no"     # SSH keys only — passwords are insecure
ssh_max_auth_tries: 3
ssh_password_auth_users: []           # Accounts allowed SSH *password* login (everyone else is key-only).
                                      # The toolbox build sets this to its admin account automatically.

# ── Baseline flavour toggles ───────────────────────────────────────────────
# The golden image baseline is LEAN by default: hardened SSH/kernel, patched,
# cloud-init ready — and nothing opinionated. Turn site flavour on here.
baseline_firewall: true               # iptables baseline ruleset
# Baseline mode is SSH from anywhere + ICMP from RFC-1918 only. Your trusted
# LAN(s) — every port open — come from the TRUSTED_SUBNETS environment
# variable, never from this file: the Semaphore "Proxmox" variable group
# supplies it on the toolbox, and a git-ignored .env (see ../../.env.example)
# supplies it for CLI runs. Empty = baseline only.
firewall_trusted_subnets: "{{ lookup('env', 'TRUSTED_SUBNETS') | default('', true) }}"
# Strict mode (only these ports, only from these subnets, SSH included):
firewall_mgmt_subnets: ""
firewall_allowed_tcp_ports: ""
# Extra ACCEPT rules on top of the baseline, per group or host. Declared here
# they are part of the baseline and survive every re-apply; rules added by
# hand belong in the LOCAL-INPUT chain instead. proto defaults to tcp,
# source to anywhere.
#   firewall_extra_rules:
#     - { port: 10000, source: "192.168.4.0/24" }      # Webmin from the LAN
#     - { port: 9100, proto: tcp }                     # node exporter
firewall_extra_rules: []
baseline_fail2ban: true               # SSH brute-force protection
baseline_create_admin: false          # bake a fixed admin account into images
                                      # (normally OFF — logins arrive per-clone via cloud-init)
baseline_branding: false              # login banner / MOTD / prompt branding
baseline_disable_ipv6: false          # disable IPv6 system-wide
baseline_monorepo_clone: false        # clone this repo to /git/monorepo on every image

# ── TLS ───────────────────────────────────────────────────────────────────
# Contact address on every Let's Encrypt certificate this inventory issues, and
# where expiry warnings go. Not per-service: it was in group_vars/espocrm and
# any second TLS host failed with an undefined variable at the certbot step.
letsencrypt_email: "darren.pilkington@it-architect.uk"

# ── Timezone / NTP ────────────────────────────────────────────────────────
system_timezone: "Europe/London"
ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org

# ── Common packages installed on every server ────────────────────────────
common_packages:
  - curl
  - wget
  - git
  - vim
  - nano
  - htop
  - jq
  - unzip
  - ca-certificates
  - net-tools
  - nmap
  - fail2ban

# ── Automatic security updates ────────────────────────────────────────────
unattended_upgrades_enabled: true
unattended_upgrades_auto_reboot: false     # Reboot automatically? Set to true with caution
unattended_upgrades_auto_reboot_time: "03:00"

#   $ANSIBLE_VAULT;1.1;AES256
#   ...

