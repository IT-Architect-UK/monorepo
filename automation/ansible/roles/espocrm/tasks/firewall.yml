---
# =============================================================================
# roles/espocrm — firewall
# =============================================================================
# A public web server needs a rule shape the repo's setup-iptables.sh does not
# cover. Its two modes are:
#   strict   — listed ports, ONLY from mgmt_subnets  (would block customers)
#   baseline — SSH from anywhere                     (too open for admin access)
#
# What is actually wanted here:
#   22        from espocrm_ssh_allowed_sources only
#   80, 443   from anywhere — customers, and Certbot's HTTP-01 challenge
#   all else  dropped
#
# ORDERING IS SAFETY-CRITICAL. The ACCEPT rules go in first and the default
# policy is set to DROP last. Reverse that and the run severs its own SSH
# session partway through, leaving the box reachable only by console.
# =============================================================================

- name: Ensure iptables persistence package is present
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
    update_cache: true
  environment:
    # Stops the package prompting about saving current rules on install.
    DEBIAN_FRONTEND: noninteractive

- name: Allow loopback
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT
    action: insert
    rule_num: "1"

- name: Allow established and related connections
  ansible.builtin.iptables:
    chain: INPUT
    ctstate: [ESTABLISHED, RELATED]
    jump: ACCEPT
    action: insert
    rule_num: "2"

- name: Allow SSH from approved sources only
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ ssh_port | default(22) }}"
    source: "{{ item }}"
    ctstate: [NEW]
    jump: ACCEPT
    comment: "SSH — admin access"
  loop: "{{ espocrm_ssh_allowed_sources }}"

- name: Allow public web traffic from anywhere
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item }}"
    ctstate: [NEW]
    jump: ACCEPT
    comment: "Public web — customers and Let's Encrypt"
  loop: "{{ espocrm_public_tcp_ports }}"

- name: Allow ICMP echo
  ansible.builtin.iptables:
    chain: INPUT
    protocol: icmp
    icmp_type: echo-request
    jump: ACCEPT
    comment: "ping — useful for monitoring"
  when: espocrm_firewall_allow_ping

# Deliberately last. Everything that should be reachable is already permitted
# by this point.
- name: Set default INPUT policy to DROP
  ansible.builtin.iptables:
    chain: INPUT
    policy: DROP

- name: Set default FORWARD policy to DROP
  ansible.builtin.iptables:
    chain: FORWARD
    policy: DROP

- name: Persist rules across reboot
  community.general.iptables_state:
    state: saved
    path: /etc/iptables/rules.v4

# =============================================================================
# IPv6
# =============================================================================
# Without this the whole ruleset above is bypassable. iptables and ip6tables are
# separate: a default-DROP INPUT policy on IPv4 leaves ip6tables at its default
# ACCEPT, so if the VPS has an IPv6 address then SSH is reachable over IPv6 from
# anywhere on the internet and the source restriction above means nothing.
#
# SSH is NOT opened over IPv6 — the allowed source is an IPv4 address, so there
# is no matching v6 source to permit. Administer over IPv4.

- name: Allow loopback (IPv6)
  ansible.builtin.iptables:
    ip_version: ipv6
    chain: INPUT
    in_interface: lo
    jump: ACCEPT
    action: insert
    rule_num: "1"
  when: espocrm_enable_ipv6

- name: Allow established and related connections (IPv6)
  ansible.builtin.iptables:
    ip_version: ipv6
    chain: INPUT
    ctstate: [ESTABLISHED, RELATED]
    jump: ACCEPT
    action: insert
    rule_num: "2"
  when: espocrm_enable_ipv6

# ICMPv6 is not optional the way ICMPv4 is. Neighbour discovery and path MTU
# discovery ride on it; drop it and IPv6 connectivity degrades in ways that look
# like random hangs rather than a firewall problem.
- name: Allow ICMPv6 (required for neighbour discovery and PMTUD)
  ansible.builtin.iptables:
    ip_version: ipv6
    chain: INPUT
    protocol: icmpv6
    jump: ACCEPT
    comment: "ICMPv6 — ND and PMTUD, do not remove"
  when: espocrm_enable_ipv6

- name: Allow public web traffic from anywhere (IPv6)
  ansible.builtin.iptables:
    ip_version: ipv6
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item }}"
    ctstate: [NEW]
    jump: ACCEPT
    comment: "Public web — customers and Let's Encrypt"
  loop: "{{ espocrm_public_tcp_ports }}"
  when: espocrm_enable_ipv6

- name: Set default IPv6 policies to DROP
  ansible.builtin.iptables:
    ip_version: ipv6
    chain: "{{ item }}"
    policy: DROP
  loop: [INPUT, FORWARD]
  when: espocrm_enable_ipv6

- name: Persist IPv6 rules across reboot
  community.general.iptables_state:
    ip_version: ipv6
    state: saved
    path: /etc/iptables/rules.v6
  when: espocrm_enable_ipv6
