---
# =============================================================================
# roles/espocrm — EspoCRM in Docker, behind nginx, with consistent backups
# =============================================================================
# Assumes Docker is already present (playbooks/deploy-docker.yml) and that the
# common role has applied the baseline firewall. See roles/espocrm/README.md.
# =============================================================================

- name: Fail early if required secrets are missing
  ansible.builtin.assert:
    that:
      - espocrm_db_password | default('', true) | length > 0
      - espocrm_db_root_password | default('', true) | length > 0
      - espocrm_admin_password | default('', true) | length > 0
      - espocrm_domain | default('', true) | length > 0
    fail_msg: >-
      espocrm_domain and the three passwords must be set. Put the passwords in
      an Ansible Vault file, never in group_vars in plain text. See the role
      README for the encrypt_string commands.
    quiet: true

- name: Reject passwords containing a single quote
  ansible.builtin.assert:
    that:
      - "\"'\" not in espocrm_db_password"
      - "\"'\" not in espocrm_db_root_password"
      - "\"'\" not in espocrm_admin_password"
    fail_msg: >-
      A password contains a single quote ('). The backup script assigns the
      database password inside single quotes, which a literal single quote
      would terminate. Generate a replacement without one - in Bitwarden,
      turn off special characters and raise the length instead.
    quiet: true

- name: Configure the firewall
  ansible.builtin.import_tasks: firewall.yml
  when: espocrm_manage_firewall
  tags: [firewall]

- name: Create EspoCRM directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ espocrm_base_dir }}"
    - "{{ espocrm_backup_dir }}"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ espocrm_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    # 0640: the file contains the database and admin passwords.
    mode: "0640"
  register: espocrm_compose

- name: Start the EspoCRM stack
  community.docker.docker_compose_v2:
    project_src: "{{ espocrm_base_dir }}"
    state: present
    pull: "{{ espocrm_pull_policy }}"
  register: espocrm_stack

- name: Wait for EspoCRM to answer on the loopback port
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ espocrm_http_port }}/"
    status_code: [200, 302]
  register: espocrm_ready
  retries: 30
  delay: 10
  until: espocrm_ready is succeeded
  # First run installs the schema, which takes a while on a small VPS.

# --- reverse proxy --------------------------------------------------------

- name: Install nginx and certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
    state: present
    update_cache: true

# certonly + webroot, deliberately not the --nginx plugin. The plugin rewrites
# the vhost, which this role also templates - so each would undo the other, and
# TLS would break on the next playbook run rather than at renewal, where it
# would at least be noticed.
- name: Create the ACME challenge webroot
  ansible.builtin.file:
    path: "{{ espocrm_acme_webroot }}/.well-known/acme-challenge"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check whether a certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ espocrm_domain }}/fullchain.pem"
  register: espocrm_cert

- name: Deploy the nginx site (HTTP only until a certificate exists)
  ansible.builtin.template:
    src: espocrm.nginx.conf.j2
    dest: /etc/nginx/sites-available/espocrm.conf
    owner: root
    group: root
    mode: "0644"
  vars:
    espocrm_tls_ready: "{{ espocrm_cert.stat.exists }}"
  notify: Reload nginx

- name: Enable the EspoCRM nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/espocrm.conf
    dest: /etc/nginx/sites-enabled/espocrm.conf
    state: link
  notify: Reload nginx

- name: Remove the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

# A site file is an include fragment - "nginx -t" on it alone is meaningless,
# and the template module's validate option would test the config currently
# installed rather than the candidate, passing or failing for the wrong reason.
# Validate the assembled configuration instead, once the symlink is in place.
- name: Validate the assembled nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

# nginx must be serving the challenge path before certbot is asked for a cert.
- name: Apply pending nginx changes now
  ansible.builtin.meta: flush_handlers

- name: Obtain the certificate
  ansible.builtin.command:
    argv:
      - /usr/bin/certbot
      - certonly
      - --webroot
      - -w
      - "{{ espocrm_acme_webroot }}"
      - -d
      - "{{ espocrm_domain }}"
      - --non-interactive
      - --agree-tos
      - -m
      - "{{ letsencrypt_email }}"
    creates: "/etc/letsencrypt/live/{{ espocrm_domain }}/fullchain.pem"
  when: espocrm_request_certificate | default(true)
  register: espocrm_certbot

- name: Re-check for the certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ espocrm_domain }}/fullchain.pem"
  register: espocrm_cert_after

- name: Deploy the nginx site again, now with TLS
  ansible.builtin.template:
    src: espocrm.nginx.conf.j2
    dest: /etc/nginx/sites-available/espocrm.conf
    owner: root
    group: root
    mode: "0644"
  vars:
    espocrm_tls_ready: "{{ espocrm_cert_after.stat.exists }}"
  when: espocrm_cert_after.stat.exists
  notify: Reload nginx

- name: Validate the assembled nginx configuration with TLS
  ansible.builtin.command: nginx -t
  changed_when: false
  when: espocrm_cert_after.stat.exists

# --- backups --------------------------------------------------------------

- name: Deploy the backup script
  ansible.builtin.template:
    src: espocrm-backup.sh.j2
    dest: /usr/local/bin/espocrm-backup.sh
    owner: root
    group: root
    # 0700: embeds the database root password.
    mode: "0700"

- name: Install the backup systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/espocrm-backup.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — automation/ansible/roles/espocrm. Edits are overwritten.
      [Unit]
      Description=EspoCRM consistent backup (database dump + application files)
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/espocrm-backup.sh
  notify: Reload systemd

- name: Install the backup systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/espocrm-backup.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — automation/ansible/roles/espocrm. Edits are overwritten.
      [Unit]
      Description=Run the EspoCRM backup on a schedule

      [Timer]
      OnCalendar={{ espocrm_backup_schedule }}
      # Catch up if the VPS was down at the scheduled moment.
      Persistent=true
      RandomizedDelaySec=300

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Enable the backup timer
  ansible.builtin.systemd:
    name: espocrm-backup.timer
    enabled: true
    state: started
    daemon_reload: true
