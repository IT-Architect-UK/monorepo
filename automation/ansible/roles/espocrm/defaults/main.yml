---
# =============================================================================
# roles/espocrm — defaults
# =============================================================================
# Secrets are deliberately NOT defaulted. The role asserts they are set, so a
# missing password fails the run immediately rather than silently installing
# EspoCRM with the upstream default of "password".
# =============================================================================

# ── Where things live ─────────────────────────────────────────────────────
espocrm_base_dir: /opt/espocrm
espocrm_backup_dir: /opt/espocrm/backups

# ── Image versions ────────────────────────────────────────────────────────
# Pinned rather than "latest": an unattended pull that silently jumps a major
# version is how a working CRM becomes a broken one overnight. Bump these
# deliberately, then re-run the playbook.
espocrm_image_tag: "9.2.4"
espocrm_mariadb_tag: "11.4"
espocrm_pull_policy: missing        # 'always' only when intentionally upgrading

# ── Networking ────────────────────────────────────────────────────────────
espocrm_http_port: 8080             # loopback only; nginx fronts it
espocrm_max_upload_size: "50m"      # keep at/above Espo's own 50M php.ini limit

# ── Application settings ──────────────────────────────────────────────────
espocrm_domain: ""                  # e.g. crm.itsurgery.me — REQUIRED
espocrm_admin_username: admin
espocrm_language: en_GB
espocrm_currency: GBP
espocrm_db_name: espocrm
espocrm_db_user: espocrm

# ── Backups ───────────────────────────────────────────────────────────────
# Produces a consistent dump into espocrm_backup_dir; Restic then ships that
# directory off-box. Schedule this BEFORE the Restic timer.
espocrm_backup_schedule: "*-*-* 02:30:00"
espocrm_local_backup_keep_days: 7

# ── Firewall ──────────────────────────────────────────────────────────────
# SSH is restricted to these sources; 80/443 stay open to the world because
# customers and Certbot need them. Losing access to the listed address means
# losing SSH — recover via the OVHcloud KVM console or rescue mode.
espocrm_manage_firewall: true
espocrm_ssh_allowed_sources:
  - "94.30.38.65/32"        # Darren's static IP
espocrm_public_tcp_ports:
  - 80                      # Certbot HTTP-01 challenge, and the HTTPS redirect
  - 443
espocrm_firewall_allow_ping: true

# Auto-detected. Governs BOTH the nginx listeners and the ip6tables ruleset —
# they must agree, or nginx binds a port the firewall does not protect.
espocrm_enable_ipv6: "{{ ansible_all_ipv6_addresses | default([]) | reject('match', '^fe80:') | list | length > 0 }}"

# ── Secrets — set these in Vault, not here ────────────────────────────────
espocrm_db_password: ""
espocrm_db_root_password: ""
espocrm_admin_password: ""
