---
# =============================================================================
# roles/common/tasks/main.yml
# =============================================================================
# Baseline tasks applied to every managed Linux server.
# Called by server-baseline.yml
# =============================================================================

- name: Update package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: packages

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  tags: packages

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: safe
  tags: packages

- name: Set system timezone
  community.general.timezone:
    name: "{{ system_timezone }}"
  tags: timezone

- name: Configure NTP
  ansible.builtin.template:
    src: timesyncd.conf.j2
    dest: /etc/systemd/timesyncd.conf
    mode: "0644"
  notify: Restart timesyncd
  tags: ntp

# Baked-in accounts conflict with the clone-identity model (users arrive
# per-clone via cloud-init) — off by default, enable via group_vars for
# standing servers that want a fixed admin account.
- name: Create admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: "{{ admin_groups }}"
    shell: /bin/bash
    create_home: true
    state: present
  when: baseline_create_admin | default(false) | bool
  tags: users

- name: Harden SSH configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH
  tags: ssh

# ── Firewall — iptables ───────────────────────────────────────────────────────
# Uses setup-iptables.sh from infrastructure/networking/firewall/ which applies
# a default-drop INPUT policy. Default mode allows SSH from anywhere and ICMP
# from RFC-1918 ranges only; set firewall_trusted_subnets to open a LAN fully,
# or firewall_mgmt_subnets (+ firewall_allowed_tcp_ports) for strict mode.
#
# Re-applied only when something relevant changed: the script itself or any
# of its inputs. A fingerprint of both is kept on the host, so the step is
# idempotent yet a new trusted subnet, port or script fix does reach hosts
# that were built before it (a plain `creates:` guard never re-ran it).
#
# Extra ACCEPT rules belong in firewall_extra_rules (group_vars/host_vars):
# they are part of the declared state and survive every re-apply. Rules
# added by hand go in the LOCAL-INPUT chain, which the script preserves.

- name: Compute the firewall fingerprint (script + inputs)
  ansible.builtin.set_fact:
    _fw_extra_rules: >-
      {%- set out = [] -%}
      {%- for r in (firewall_extra_rules | default([])) -%}
      {%- set _ = out.append((r.proto | default('tcp')) ~ ':' ~ r.port ~ ':' ~ (r.source | default(''))) -%}
      {%- endfor -%}
      {{ out | join(';') }}
  when: baseline_firewall | default(true) | bool
  tags: firewall

- name: Compute the firewall fingerprint (hash)
  ansible.builtin.set_fact:
    _fw_fingerprint: >-
      {{ (lookup('file', playbook_dir ~ '/../../../infrastructure/networking/firewall/setup-iptables.sh')
          ~ '|' ~ firewall_mgmt_subnets | default('')
          ~ '|' ~ firewall_allowed_tcp_ports | default('')
          ~ '|' ~ firewall_trusted_subnets | default('')
          ~ '|' ~ _fw_extra_rules
          ~ '|' ~ ssh_port | default(22)) | hash('sha256') }}
  when: baseline_firewall | default(true) | bool
  tags: firewall

- name: Read the fingerprint of the last applied ruleset
  ansible.builtin.slurp:
    src: /etc/iptables/.baseline-fingerprint
  register: _fw_applied
  failed_when: false
  when: baseline_firewall | default(true) | bool
  tags: firewall

- name: Copy iptables setup script to target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../infrastructure/networking/firewall/setup-iptables.sh"
    dest: /usr/local/sbin/setup-iptables.sh
    mode: "0750"
  when: baseline_firewall | default(true) | bool
  tags: firewall

- name: Apply iptables baseline ruleset (script or inputs changed — hand-added rules outside LOCAL-INPUT are lost)
  ansible.builtin.command: /usr/local/sbin/setup-iptables.sh
  environment:
    MGMT_SUBNETS: "{{ firewall_mgmt_subnets | default('') }}"
    ALLOWED_TCP_PORTS: "{{ firewall_allowed_tcp_ports | default('') }}"
    TRUSTED_SUBNETS: "{{ firewall_trusted_subnets | default('') }}"
    EXTRA_RULES: "{{ _fw_extra_rules }}"
  when:
    - baseline_firewall | default(true) | bool
    - (_fw_applied.content | default('') | b64decode | trim) != _fw_fingerprint
  tags: firewall

- name: Record the fingerprint of the applied ruleset
  ansible.builtin.copy:
    dest: /etc/iptables/.baseline-fingerprint
    content: "{{ _fw_fingerprint }}\n"
    mode: "0644"
  when: baseline_firewall | default(true) | bool
  tags: firewall

# ── fail2ban ──────────────────────────────────────────────────────────────────
- name: Configure fail2ban (SSH brute-force protection)
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime  = {{ fail2ban_bantime | default(3600) }}
      findtime = {{ fail2ban_findtime | default(600) }}
      maxretry = {{ fail2ban_maxretry | default(5) }}

      [sshd]
      enabled = true
      port    = {{ ssh_port | default(22) }}
    mode: "0644"
  notify: Restart fail2ban
  when: baseline_fail2ban | default(true) | bool
  tags: security

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: baseline_fail2ban | default(true) | bool
  tags: security

# Handlers (Restart SSH / Restart timesyncd / Restart fail2ban) live in
# roles/common/handlers/main.yml -- Ansible loads that automatically.

# ── Optional site flavour (all default OFF — lean golden baseline) ──────────
# Enable per site in inventory/group_vars/all.yml. Each reuses the standalone
# script from this repo, so behaviour is identical to running it by hand.

- name: Apply server branding (baseline_branding)
  ansible.builtin.script: "{{ playbook_dir }}/../../../infrastructure/servers/linux/configuration/apply-branding.sh --company {{ branding_company | default('IT-Architect') | quote }} --colour Cyan --non-interactive"
  when: baseline_branding | default(false) | bool
  tags: branding

- name: Disable IPv6 system-wide (baseline_disable_ipv6)
  ansible.builtin.script: "{{ playbook_dir }}/../../../infrastructure/servers/linux/configuration/disable-ipv6.sh"
  when: baseline_disable_ipv6 | default(false) | bool
  tags: ipv6

- name: Install monorepo sync (baseline_monorepo_clone)
  ansible.builtin.script: "{{ playbook_dir }}/../../../infrastructure/servers/linux/configuration/sync-monorepo.sh"
  when: baseline_monorepo_clone | default(false) | bool
  tags: monorepo
