---
# =============================================================================
# roles/vitals — what the host knows about itself
# =============================================================================
# n8n runs in a container and cannot see the machine underneath it: not the
# disk, not the certificates, not whether a reboot is pending. This role puts a
# small script on the host that writes those facts to a JSON file on a timer,
# and lets nginx serve that file to the container and nobody else.
#
# A read-only snapshot on a timer, deliberately. The alternative — giving a
# container a socket or a shell on its host so a dashboard can run commands —
# is a much larger hole than any dashboard is worth.
# =============================================================================

vitals_dir: /opt/vitals
vitals_file: /opt/vitals/vitals.json
# The fast half — memory, disks, containers, systemd units — is cheap enough
# to run every minute. Anything sudden shows up within a minute of happening.
vitals_schedule: "*:0/1"

# The slow half — certificates, backup ages, pending updates — is cached and
# only recomputed when older than this. These change on the scale of hours and
# days; apt-get -s upgrade alone parses the whole package database, and doing
# that sixty times an hour would cost real CPU to learn nothing.
vitals_slow_max_age: 900          # fifteen minutes, in seconds
vitals_disk_paths:
  - /
# Backup directories to report the age of the newest file in. A backup that
# quietly stopped running looks exactly like one that is working.
vitals_backup_dirs:
  - /opt/n8n/backups
  - /opt/espocrm/backups
  - /opt/meshcentral/backups

# Units worth knowing about that are not containers. `systemctl is-active`
# returns "inactive" for a unit that is installed and stopped, and nothing at
# all for one that was never installed — the page tells those two apart.
vitals_service_units:
  - nginx
  - docker
  - webmin
  - certbot.timer
