---
# =============================================================================
# roles/webmin/tasks/main.yml
# =============================================================================
# Installs Webmin from its OFFICIAL apt repository (no community role, no
# hardcoded key). Mirrors Webmin's supported setup: configure the vendor repo
# via webmin-setup-repo.sh, then apt-install and enable the service.
# Idempotent — the repo step is guarded by `creates`.
# =============================================================================

# Pinned to a release tag and checksummed rather than fetched from master.
# The SHA256 was computed from the tagged file on 2026-09-02 (Webmin publishes
# none); bump webmin_setup_tag and webmin_setup_sha256 together.
- name: Download the official Webmin repo setup script (pinned, checksummed)
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/webmin/webmin/{{ webmin_setup_tag | default('2.660') }}/webmin-setup-repo.sh"
    dest: /usr/local/sbin/webmin-setup-repo.sh
    mode: "0755"
    checksum: "sha256:{{ webmin_setup_sha256 | default('c752127dcd345494432979eb13140f358243b95b249e9fb7744034393dbccab9') }}"
  tags: webmin

- name: Configure the official Webmin apt repository
  ansible.builtin.shell: "echo y | bash /usr/local/sbin/webmin-setup-repo.sh"
  args:
    creates: /etc/apt/sources.list.d/webmin.list
  tags: webmin

- name: Install Webmin
  ansible.builtin.apt:
    name: webmin
    state: present
    update_cache: true
    install_recommends: true
  tags: webmin

- name: Ensure Webmin is enabled and running
  ansible.builtin.service:
    name: webmin
    state: started
    enabled: true
  tags: webmin

- name: Webmin access details
  ansible.builtin.debug:
    msg: "Webmin ready — https://{{ ansible_default_ipv4.address | default(inventory_hostname) }}:{{ webmin_port | default(10000) }}"
  when: not (webmin_domain | default('', true) | length > 0)
  tags: webmin

# On a private network, reaching Webmin on its own port is fine and the role
# stops here. On a public VPS it is not, so setting webmin_domain additionally
# puts nginx and a certificate in front and leaves the port closed.
- name: Put Webmin behind nginx
  ansible.builtin.import_tasks: proxy.yml
  when: webmin_domain | default('', true) | length > 0
  tags: [webmin, proxy]
