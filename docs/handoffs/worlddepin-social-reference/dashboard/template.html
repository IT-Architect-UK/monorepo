<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World DePIN — Operations</title>
<style>
/* World DePIN brand theme — tokens mirror assets/style.css on worlddepin.io
   (bg #0a0a0f, cards #111118/#16161f, accent #FFE600, Inter, radius 12/20).
   Chart series use darkened brand steps that pass the dark-surface checks:
   #a89400 / #3987e5 — all-pairs CVD ΔE 17.1 (tritan), normal-vision 29.5. */
@font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:swap;
  src:local('Inter'),local('Inter var')}
:root{
--bg:#0a0a0f;--surface-1:#111118;--surface-2:#16161f;--border:rgba(255,255,255,.07);
--text-primary:#ffffff;--text-secondary:#b9b9cc;--text-muted:#8888a0;
--accent:#FFE600;--accent-dk:#ccb800;
--s1:#a89400;--s2:#3987e5;
--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
--radius:12px;--radius-lg:20px;--shadow:none}
*{box-sizing:border-box}
/* The layout is designed at 1680px; Darren's screen fits it at 75% browser
   zoom. Bake that scale in so the page fits at 100% with nothing to fiddle. */
html{zoom:.75}
body{margin:0;background:var(--bg);color:var(--text-primary);-webkit-font-smoothing:antialiased;
font:16px/1.6 'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;
background:rgba(10,10,15,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;flex-wrap:wrap}
header img{width:28px;height:28px;border-radius:6px}
h1{font-size:15px;margin:0;font-weight:800;letter-spacing:-.01em}
h1 b{color:var(--accent)}
.muted{color:var(--text-muted)}.sec{color:var(--text-secondary)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 13px;border-radius:8px;cursor:pointer;
color:var(--text-secondary);font:inherit;font-weight:600;transition:.2s ease}
nav button:hover{color:var(--accent)}
nav button[aria-selected=true]{background:var(--accent);color:#000}
/* Wide enough that the 11-column Licences table fits without a horizontal
   scrollbar on a normal laptop window; still centred on very large screens. */
main{padding:20px;max-width:1680px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;
display:flex;flex-direction:column}
.tile .k{min-height:2.4em}
.tile .k{font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:600;
text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-size:27px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--text-muted);margin-top:3px}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-lg);
padding:18px;margin-bottom:18px}
.card h2{font-size:12px;margin:0 0 14px;font-weight:700;color:var(--text-muted);
text-transform:uppercase;letter-spacing:.06em}
/* One scroll box per table: the header row sticks to its top, so column names
   stay on screen through 1,350 rows. Horizontal overflow lives here too. */
.tblscroll{overflow:auto;max-height:calc(100vh - 230px);-webkit-overflow-scrolling:touch}
.tblwrap{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:700;color:var(--text-muted);padding:8px 10px;
border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none;
text-transform:uppercase;font-size:11px;letter-spacing:.04em}
/* border-collapse drops the border on a sticky cell, so draw it as an inset
   shadow and give the cell an opaque background to cover the rows beneath. */
.tblscroll thead th{position:sticky;top:0;z-index:2;background:var(--surface-1);
border-bottom:0;box-shadow:inset 0 -1px 0 var(--border)}
th:hover{color:var(--accent)}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
/* The lease code is the one cell allowed to wrap: it is 36 characters and
   holding it on one line pushed the table past a laptop window. It breaks at
   the hyphens (see the <wbr> tags), never mid-segment. */
.lc{white-space:normal;display:inline-block;min-width:172px}
.idbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font:inherit;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
white-space:nowrap;text-decoration:underline dotted}
/* One line in a table cell (a lease code is 36 chars and wrapped to four
   lines before); only the detail panels, where width is tight, may break. */
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:nowrap}
table.dtl .mono{white-space:normal;word-break:break-all}
table.dtl th.dfk{cursor:default;text-transform:none;letter-spacing:0;font-size:12px;
width:45%;white-space:normal;color:var(--text-muted)}
table.dtl th.dfk:hover{color:var(--text-muted)}
.dfh{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;
letter-spacing:.05em;margin-bottom:6px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;
align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal .sheet{background:var(--surface-1);border:1px solid var(--border);
border-radius:var(--radius-lg);max-width:940px;width:100%;padding:20px 22px}
.modal h2{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.01em;
text-transform:none;color:var(--text-primary)}
.modal .sub{color:var(--text-muted);font-size:13px;margin-bottom:16px}
.modal .x{margin-left:auto;background:none;border:0;color:var(--text-muted);
font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.modal .x:hover{color:var(--accent)}
.mhead{display:flex;align-items:flex-start;gap:12px}
.linkcell{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);
font:inherit;font-size:13px;text-align:left;text-decoration:underline dotted}
.linkcell:hover{text-decoration:underline}
.field{display:block;margin:0 0 10px}
.field span{display:block;font-size:11px;color:var(--text-muted);text-transform:uppercase;
letter-spacing:.05em;font-weight:700;margin-bottom:4px}
.field input,.field select{width:100%;background:var(--surface-2);color:var(--text-primary);
border:1px solid var(--border);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.on{color:var(--good);background:rgba(34,197,94,.12)}
.off{color:var(--bad);background:rgba(239,68,68,.12)}
.wait{color:var(--warn);background:rgba(245,158,11,.14)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.segbtn{background:none;border:none;color:var(--text-muted);font:inherit;font-size:12px;
font-weight:600;padding:3px 10px;cursor:pointer}
.segbtn.on{background:var(--accent);color:#111;cursor:default}
.segbtn:not(.on):hover{color:var(--accent)}
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
input.cell,select.cell{background:transparent;border:1px solid transparent;border-radius:6px;
padding:3px 6px;color:var(--text-primary);font:inherit;font-size:13px;width:100%;min-width:130px}
input.cell:hover,select.cell:hover{border-color:var(--border);background:var(--surface-2)}
input.cell:focus,select.cell:focus{outline:none;border-color:var(--accent);background:var(--surface-2)}
input[type=search]{background:var(--surface-2);border:1px solid var(--border);
border-radius:8px;padding:8px 12px;color:var(--text-primary);font:inherit;font-size:13px;min-width:200px}
input[type=search]:focus{outline:none;border-color:var(--accent)}
svg{display:block;max-width:100%;overflow:visible}
.bar{transition:opacity .12s}.bar:hover{opacity:.75}
#tip{position:fixed;pointer-events:none;background:var(--surface-2);border:1px solid var(--border);
border-radius:8px;padding:8px 11px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.5);
opacity:0;transition:opacity .1s;z-index:50;max-width:260px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-secondary);margin-bottom:10px;flex-wrap:wrap}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.warnbox{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.35);
border-radius:var(--radius);padding:13px 15px;margin-bottom:18px;font-size:13px;line-height:1.55}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
code{background:var(--surface-2);padding:1px 6px;border-radius:4px;font-size:12px;color:var(--accent-dk)}
a{color:var(--accent)}
.themebtn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 11px;
cursor:pointer;color:var(--text-secondary);font:inherit;font-size:12px}
.themebtn:hover{border-color:var(--accent);color:var(--accent)}
.themebtn.danger{border-color:rgba(239,68,68,.55);color:var(--bad)}
.themebtn.danger:hover{background:rgba(239,68,68,.12);border-color:var(--bad);color:var(--bad)}
.dangerbox{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);border-radius:10px;padding:12px 14px;margin-top:12px}
.chg{font-size:12px;line-height:1.45}.chg b{font-weight:600;color:var(--text-secondary)}
.chg s{color:var(--text-muted)}.chg i{font-style:normal;color:var(--text-primary)}
@media (max-width:640px){main{padding:12px}.tile .v{font-size:23px}th,td{padding:7px 8px}}
/* Whether you are looking at live data or a snapshot is the first thing you
   need to know, so it sits above the content rather than in a corner. */
.livebar{padding:9px 20px;font-size:12.5px;line-height:1.5;border-bottom:1px solid var(--border);
display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.livebar:empty{display:none}
.livebar.off{background:var(--surface-1);color:var(--text-secondary)}
.livebar.live{background:rgba(34,197,94,.10);color:#b7f0c9;border-bottom-color:rgba(34,197,94,.3)}
.livebar.warn{background:rgba(245,158,11,.10);color:#f6d9a4;border-bottom-color:rgba(245,158,11,.35)}
.livebar .themebtn{margin-left:auto}
/* Monitoring tab */
.mon-banner{border-radius:12px;padding:13px 18px;border:1px solid;margin-bottom:14px}
.mon-banner b{font-size:15px;display:block}
.mon-banner span{font-size:12.5px;opacity:.85}
.mon-banner.green{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:#b7f0c9}
.mon-banner.amber{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.45);color:#f6d9a4}
.mon-banner.red{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.5);color:#f6b3b3}
.mondiag{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;overflow-x:auto}
.mondiag h2{margin:2px 0 8px;font-size:14px}
.mongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;margin-top:14px}
.moncard{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.moncard h3{margin:0;font-size:13.5px;display:flex;align-items:center}
.moncard .sub{font-size:11.5px;color:var(--text-muted);margin:2px 0 0 16px}
.moncard ul{list-style:none;margin:9px 0 0;padding:0}
.moncard li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
  padding:4px 0;border-top:1px solid var(--border)}
.moncard li span:last-child{color:var(--text-secondary);text-align:right}
.mdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;flex:none}
.mdot.green{background:var(--good)} .mdot.amber{background:var(--warn)} .mdot.red{background:var(--bad)}
.monfoot{margin-top:14px;font-size:11.5px;color:var(--text-muted);line-height:1.7}
/* Admin Guide tab */
.docbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.docbar button{padding:7px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-1);color:var(--text-secondary);cursor:pointer;font:inherit;font-size:12.5px}
.docbar button:hover{color:var(--text-primary)}
.docbar button[aria-selected=true]{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
.docview{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;
  padding:22px 30px 26px;max-width:980px;line-height:1.65;font-size:13.5px}
.docview h1{font-size:20px;margin:.2em 0 .6em}
.docview h2{font-size:16px;margin:1.4em 0 .5em;border-bottom:1px solid var(--border);padding-bottom:4px}
.docview h3{font-size:14px;margin:1.2em 0 .4em}
.docview p{margin:.6em 0}
.docview pre{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;overflow-x:auto;font-size:12px;line-height:1.5}
.docview code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:12px}
.docview pre code{background:none;padding:0}
.docview table{border-collapse:collapse;margin:.8em 0}
.docview th,.docview td{border:1px solid var(--border);padding:6px 10px;text-align:left;font-size:12.5px}
.docview th{background:var(--surface-2)}
.docview blockquote{border-left:3px solid var(--accent);margin:.8em 0;padding:4px 14px;
  color:var(--text-secondary);background:var(--surface-2);border-radius:0 8px 8px 0}
.docview ul,.docview ol{margin:.6em 0;padding-left:24px}
.docview li{margin:.25em 0}
.docview a{color:var(--accent)}
.docview hr{border:0;border-top:1px solid var(--border);margin:1.2em 0}
.docview img{max-height:72px;border-radius:12px;display:block}
/* Templates tab */
.ph{color:var(--accent);background:rgba(255,230,0,.08);border-radius:4px;padding:0 3px}
.tplmeta{font-size:12px;color:var(--text-secondary);margin-bottom:10px;display:flex;gap:16px;flex-wrap:wrap}
.tpl-edit input{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-2);color:inherit;font:inherit;margin:4px 0 12px}
.tpl-edit textarea{width:100%;min-height:400px;background:var(--surface-2);color:inherit;
  border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:4px;
  font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style></head><body>

<script>
const D = /*__DATA__*/;
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n, d=0) => n == null ? '—' : Number(n).toLocaleString('en-GB', {minimumFractionDigits:d, maximumFractionDigits:d});
const ago = (iso) => { if(!iso) return '—'; const s=(Date.now()-new Date(iso))/1000;
  if(s<3600) return Math.round(s/60)+'m'; if(s<86400) return Math.round(s/3600)+'h'; return Math.round(s/86400)+'d'; };


const tip = document.getElementById('tip');
function showTip(e, html){ tip.innerHTML = html; tip.style.opacity = 1;
  const r = 14; let x = e.clientX + r, y = e.clientY + r;
  if (x + tip.offsetWidth > innerWidth) x = e.clientX - tip.offsetWidth - r;
  if (y + tip.offsetHeight > innerHeight) y = e.clientY - tip.offsetHeight - r;
  tip.style.left = x+'px'; tip.style.top = y+'px'; }
function hideTip(){ tip.style.opacity = 0; }

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ---------- charts (inline SVG, no deps) ---------- */
function lineChart(rows, keys, {h=190, labels={}} = {}) {
  if (rows.length < 2) return `<p class="muted">Not enough history yet — the collector appends a point every 30 minutes. (${rows.length} so far.)</p>`;
  const w = 720, pad = {t:10,r:14,b:24,l:38};
  const xs = rows.map(r => new Date(r.ts).getTime());
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const all = keys.flatMap(k => rows.map(r => r[k] ?? 0));
  const y1 = Math.max(...all, 1) * 1.15;
  const X = t => pad.l + (x1===x0 ? 0 : (t - x0) / (x1 - x0)) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - (v / y1) * (h - pad.t - pad.b);
  const colors = [css('--s2'), css('--s1')];
  const ticks = [0, Math.round(y1/2), Math.round(y1)];
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="fleet status over time">`;
  ticks.forEach(v => { s += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css('--border')}" stroke-width="1"/>
    <text x="${pad.l-7}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="${css('--text-muted')}">${v}</text>`; });
  keys.forEach((k, i) => {
    const d = rows.map((r, j) => `${j?'L':'M'}${X(xs[j]).toFixed(1)},${Y(r[k] ?? 0).toFixed(1)}`).join('');
    s += `<path d="${d}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    rows.forEach((r, j) => { s += `<circle cx="${X(xs[j]).toFixed(1)}" cy="${Y(r[k] ?? 0).toFixed(1)}" r="4" fill="${colors[i%colors.length]}"
      stroke="${css('--surface-1')}" stroke-width="2" class="bar"
      onmousemove="showTip(event,'<b>${labels[k]||k}: ${r[k]??0}</b><br>${new Date(r.ts).toLocaleString('en-GB')}')" onmouseleave="hideTip()"/>`; });
  });
  [x0, x1].forEach((t, i) => s += `<text x="${X(t)}" y="${h-6}" text-anchor="${i?'end':'start'}" font-size="11" fill="${css('--text-muted')}">${new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</text>`);
  return s + '</svg>';
}

/* 60-day uptime strip: one slim bar per day, green when the day met the
   lease's minimum (or 50% when none), red when offline/zero, amber between.
   Height ∝ uptime. Hover for the exact figure. */
function fillDays(rows, days) {
  /* One entry per CALENDAR day for the window — gaps become explicit
     no-data days, exactly like the portal's chart. */
  const by = Object.fromEntries((rows || []).map(r => [r.day, r]));
  const out = [];
  for (let i = days - 1; i >= 0; i--) {
    const day = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
    out.push(by[day] || {day, uptime_pct: null});
  }
  return out;
}

function uptimeStrip(rows, minPct, {h=64, mini=false, days=60} = {}) {
  if (!rows || !rows.length) return mini ? '<span class="muted">—</span>'
    : '<p class="muted">No daily history yet — it accrues one point per day while the licence is leased.</p>';
  rows = fillDays(rows, days);
  const min = minPct == null ? 50 : minPct;
  const w = mini ? 160 : 720, pad = mini ? 1 : 2, bw = Math.max((w - (mini ? 0 : 40)) / rows.length, mini ? 1.5 : 3);
  let s = `<svg viewBox="0 0 ${w} ${h+(mini?0:18)}" ${mini ? `width="${w}" height="${h}"` : ''} role="img" aria-label="daily uptime">`;
  s += `<line x1="0" x2="${w}" y1="${(h - h*min/100).toFixed(1)}" y2="${(h - h*min/100).toFixed(1)}" stroke="${css('--border')}" stroke-dasharray="3 3"/>`;
  rows.forEach((r, i) => {
    const missing = r.uptime_pct == null;
    const u = missing ? 0 : Number(r.uptime_pct);
    const col = missing ? css('--border')
      : (u <= 0 ? css('--bad') : (u >= min ? css('--good') : css('--warn')));
    const bh = missing ? 3 : Math.max(h * u / 100, 2);
    s += `<rect x="${(i*bw+pad).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${(bw-pad*1.5).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${col}"
      onmousemove="showTip(event,'<b>${r.day}</b><br>${missing ? 'no data (counts as 0%)' : u.toFixed(1) + '%'}')" onmouseleave="hideTip()"/>`;
  });
  if (!mini) {
    const first = rows[0].day, last = rows[rows.length-1].day;
    s += `<text x="2" y="${h+14}" font-size="10" fill="${css('--text-muted')}">${first}</text>
          <text x="${w-2}" y="${h+14}" text-anchor="end" font-size="10" fill="${css('--text-muted')}">${last}</text>`;
  }
  return s + '</svg>';
}

/* Daily UPS columns — built for up to ~365 slim bars, tooltip per day. */
function dayChart(series, {h=180} = {}) {
  if (!series.length) return '<p class="muted">No allocations in this window.</p>';
  const w = 720, pad = {t:14, r:8, b:22, l:44};
  const max = Math.max(...series.map(s => s.v), 1e-9);
  const bw = (w - pad.l - pad.r) / series.length;
  const Y = v => h - pad.b - (v / (max * 1.08)) * (h - pad.t - pad.b);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="daily rewards">`;
  [0, max].forEach(v => s += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css('--border')}"/>
    <text x="${pad.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="${css('--text-muted')}">${v.toFixed(3)}</text>`);
  series.forEach((it, i) => {
    const x = pad.l + i * bw + 1, bh = Math.max(h - pad.b - Y(it.v), 1.5);
    s += `<rect class="bar" x="${x.toFixed(1)}" y="${Y(it.v).toFixed(1)}" width="${Math.max(bw-2,1.5).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${css('--accent-dk')}"
      onmousemove="showTip(event,'<b>${it.day}</b><br>${it.v.toFixed(6)} UPS')" onmouseleave="hideTip()"/>`;
  });
  s += `<text x="${pad.l}" y="${h-6}" font-size="10" fill="${css('--text-muted')}">${series[0].day}</text>
        <text x="${w-pad.r}" y="${h-6}" text-anchor="end" font-size="10" fill="${css('--text-muted')}">${series[series.length-1].day}</text>`;
  return s + '</svg>';
}

function uptimeAvg(rows, days) {
  const cut = new Date(Date.now() - days * 864e5).toISOString().slice(0, 10);
  const win = (rows || []).filter(r => r.day >= cut && r.uptime_pct != null);
  if (!win.length) return null;
  return Math.round(win.reduce((a, r) => a + Number(r.uptime_pct), 0) / win.length * 10) / 10;
}

/* Daily history for a licence: the portal's own per-day series when we
   have it, else our once-a-day snapshots. */
function dailyFor(key) {
  return (D.daily[key] && D.daily[key].length) ? D.daily[key] : (D.uptime[key] || []);
}

/* Window average THE PORTAL'S WAY: divide by the whole window, missing
   days count as zero — this is what makes our numbers match
   manage.unetwork.io's Today / Last 7 Days / Last 30 Days tiles. */
function portalAvg(rows, days) {
  if (!rows || !rows.length) return null;
  const cut = new Date(Date.now() - days * 864e5).toISOString().slice(0, 10);
  const sum = rows.filter(r => r.day >= cut && r.uptime_pct != null)
                  .reduce((a, r) => a + Number(r.uptime_pct), 0);
  return Math.round(sum / days * 10) / 10;
}

function barChart(items, {h=200, fmtv=(v)=>v, color='--accent-dk'} = {}) {
  if (!items.length) return '<p class="muted">No data.</p>';
  const w = 720, pad = {t:22,r:10,b:52,l:38};
  const max = Math.max(...items.map(i => i.v), 1);
  const bw = (w - pad.l - pad.r) / items.length;
  const Y = v => h - pad.b - (v / (max*1.1)) * (h - pad.t - pad.b);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="bar chart">`;
  [0, max].forEach(v => s += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css('--border')}"/>
    <text x="${pad.l-7}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="${css('--text-muted')}">${fmtv(v)}</text>`);
  items.forEach((it, i) => {
    const x = pad.l + i*bw + 2, bh = Math.max(h - pad.b - Y(it.v), 1);
    s += `<rect class="bar" x="${x.toFixed(1)}" y="${Y(it.v).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${bh.toFixed(1)}"
      rx="4" fill="${css(color)}" onmousemove="showTip(event,'<b>${esc(it.label)}</b><br>${fmtv(it.v)}${it.sub?'<br>'+esc(it.sub):''}')" onmouseleave="hideTip()"/>`;
    s += `<text x="${(x + (bw-4)/2).toFixed(1)}" y="${(Y(it.v)-6).toFixed(1)}" text-anchor="middle" font-size="11"
      fill="${css('--text-secondary')}" font-variant-numeric="tabular-nums">${fmtv(it.v)}</text>`;
    s += `<text x="${(x + (bw-4)/2).toFixed(1)}" y="${h-pad.b+14}" text-anchor="end" font-size="10.5" fill="${css('--text-muted')}"
      transform="rotate(-35 ${(x+(bw-4)/2).toFixed(1)} ${h-pad.b+14})">${esc(String(it.label).slice(0,18))}</text>`;
  });
  return s + '</svg>';
}

/* ---------- table with sort + filter ---------- */
function table(id, cols, rows) {
  const head = cols.map((c,i) => `<th onclick="sortTable('${id}',${i})">${esc(c.h)}</th>`).join('');
  const body = rows.map(r => '<tr>' + cols.map(c => `<td class="${c.cls||''}">${c.f(r)}</td>`).join('') + '</tr>').join('');
  return `<div class="tblscroll"><table id="${id}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function sortTable(id, col) {
  const t = document.getElementById(id), tb = t.tBodies[0];
  const dir = t.dataset.sc == col && t.dataset.sd == 'asc' ? 'desc' : 'asc';
  t.dataset.sc = col; t.dataset.sd = dir;
  const val = tr => { const s = tr.cells[col].innerText.replace(/[,%\s]/g,''); const n = parseFloat(s);
    return isNaN(n) ? tr.cells[col].innerText.toLowerCase() : n; };
  [...tb.rows].sort((a,b) => { const x=val(a), y=val(b);
    return (x<y?-1:x>y?1:0) * (dir=='asc'?1:-1); }).forEach(r => tb.appendChild(r));
}
const pendingDeviceKeys = () => new Set((D.pending||[])
  .filter(a => a.kind === 'device_edit' && a.status === 'pending')
  .map(a => (a.payload||{}).license_key));
const pendingRevKeys = () => new Set((D.pending||[])
  .filter(a => a.kind === 'revocation_action' && a.status === 'pending')
  .map(a => (a.payload||{}).license_key));
const pendingModeRefs = () => new Set((D.pending||[])
  .filter(a => a.kind === 'contact_mode' && a.status === 'pending')
  .map(a => (a.payload||{}).ref));
const pendingIssues = () => (D.pending||[])
  .filter(a => a.kind === 'manual_issue' && a.status === 'pending');
const pendingNotifRefs = () => new Set((D.pending||[])
  .filter(a => a.kind === 'contact_notifications' && a.status === 'pending')
  .map(a => (a.payload||{}).ref));
const pendingGlobalPause = () => (D.pending||[])
  .find(a => a.kind === 'alerts_global' && a.status === 'pending');
const pendingContactDeleteRefs = () => new Set((D.pending||[])
  .filter(a => a.kind === 'contact_delete' && a.status === 'pending')
  .map(a => (a.payload||{}).ref));
const UNDELETABLE_REFS = new Set(['WD-00001', 'WD-00002']);
const pendingDeleteKeys = () => new Set((D.pending||[])
  .filter(a => a.kind === 'device_delete' && a.status === 'pending')
  .map(a => (a.payload||{}).license_key));

/* A terms-only licence held by a CRM contact is a code we issued that
   nobody has activated yet. Its "offline for 99d" figure is the NODE
   hardware's old history, not the code's age — misleading, so these rows
   show the issue age and the auto-expiry date instead. */
const awaitingAct = r => r.pool_status === 'terms_only' && r.owner_kind === 'crm';
function issuedAt(r){
  const c = (D.contacts||[]).find(x => x.ref === r.owner_ref) || {};
  return c.welcome_email_sent_at || c.added_at || c.crm_created_at || null;
}
function issuedCell(r){
  const t = issuedAt(r);
  if (!t) return '<span class="muted">awaiting activation</span>';
  return `<span title="code issued ${esc(String(t).slice(0,10))} — the node's old offline history is hidden until the code is activated">issued ${days(t)}d ago</span>`;
}
function expiresCell(r){
  const cfg = D.expiry || {};
  if ((cfg.protected_refs || []).includes(r.owner_ref))
    return '<span class="muted" title="protected holder — codes never auto-expire">no auto-expiry</span>';
  const t = issuedAt(r), ed = cfg.expire_days || 14;
  if (!t) return '<span class="muted">&mdash;</span>';
  const when = new Date(new Date(t).getTime() + ed * 864e5).toISOString().slice(0,10);
  return days(t) <= ed
    ? `<span title="unactivated codes are reclaimed automatically after ${ed} days">auto-expires ${when}</span>`
    : '<span class="pill off" title="past the activation window — the collector reclaims it on its next sweep">expiring</span>';
}
/* Rows the Devices tab shows. Defined once so the renderer and the filter can
   never drift apart — they index the same array position for position. */
function devRows(){
  /* Devices = licences in someone's hands (leased/activated) plus those we
     issued to a contact that await activation. Marketplace LISTINGS
     (owner MARKETPLACE, not leased) are stock, not devices — Licences tab. */
  return (D.devices||[]).filter(d =>
    d.pool_status === 'leased' || d.owner_kind === 'crm');
}
function applyDevFilters(){
  const q = (document.getElementById('devq').value||'').toLowerCase();
  const kind = document.getElementById('devowner').value;
  const pool = document.getElementById('devpool').value;
  const source = document.getElementById('devsource').value;
  const src = devRows();
  let shown = 0;
  [...document.getElementById('devtab').tBodies[0].rows].forEach((tr,i) => {
    const d = src[i] || {};
    const ok = (!q || tr.innerText.toLowerCase().includes(q) ||
                (d.our_alias||'').toLowerCase().includes(q) || (d.owner_name||'').toLowerCase().includes(q))

async function queueDelete(key){
  const btn = document.getElementById('delGo'); if (btn) btn.disabled = true;
  const msg = document.getElementById('delMsg');
  try {
    const s = await sbSession();
    if (!s) throw new Error('signed out — reload and sign in');
    const saved = await sbPost('actions', s, [{kind: 'device_delete',
      payload: {license_key: key, reason: (document.getElementById('delReason')||{}).value?.trim() || ''},
      requested_by: (s.user||{}).email || null}]);
    D.pending = (D.pending||[]).concat(saved);

    const del = document.getElementById('mDel'); if (del) del.replaceWith(Object.assign(document.createElement('span'), {className:'pill off', textContent:'deletion queued'}));
  } catch(e) {
    if (btn) btn.disabled = false;
    if (msg) msg.textContent = 'Could not queue the deletion: ' + e.message;

}

/* Customer alerts (the daily "get back online" nudges and the offboarding
   ladder). State comes from the contact's notifications block — the same
   one inbox.py/messaging.py update when a ULO replies STOP / PAUSE /
   START — and every click queues a contact_notifications action that the
   collector applies within 30 minutes. */
function alertsState(c){
  const n = c.notifications || {};
  const opt = (n.opt_out||{}).status;
  if ((opt && opt !== 'none') || c.alert_opt_out_at)
    return {key:'stopped', label:'stopped (by the ULO)', pill:'off'};
  if (n.enabled === false) return {key:'off', label:'off', pill:'off'};
  const until = n.pause_until ? new Date(n.pause_until) : null;
  if (until && until.getTime() > Date.now())
    return {key:'paused', label:'paused until ' + until.toLocaleString('en-GB',
      {timeZone:'Europe/London', hour:'2-digit', minute:'2-digit', day:'numeric', month:'short'}), pill:'wait'};
  return {key:'on', label:'on', pill:'on'};
}
function alertsCell(c){
  if (c.ref === 'WD-00002')
    return '<span class="muted" title="Marketplace licences are reached through the portal\'s in-app chat only">in-app only</span>';
  const st = alertsState(c), n = c.notifications || {}, ch = n.channels || {};
  const pend = pendingNotifRefs().has(c.ref)
    ? ' <span class="pill wait" title="queued — the collector applies it within 30 minutes">pending sync</span>' : '';
  const on = st.key === 'on' || st.key === 'paused';
  const b = (label, isOn, disabled, title, payload) =>
    `<button class="segbtn${isOn?' on':''}" ${disabled?'disabled':''} title="${esc(title)}"
       onclick="uloNotif('${esc(c.ref)}',${esc(JSON.stringify(payload))})">${label}</button>`;
  const master = '<span class="seg">' +
    b('On', on, on, st.key === 'stopped' ? 'The ULO replied STOP — clicking On resumes alerts on their behalf'
        : st.key === 'paused' ? 'Paused by the ULO for 24 h — clicking On lifts the pause early' : 'Alerts are on',
      st.key === 'on' ? {enabled:true} : {resume:true}) +
    b('Off', !on, !on, 'No customer alerts to this contact (final warning and reclaim notices still go)', {enabled:false}) +
    '</span>';
  const inapp = (D.devices||[]).some(d => d.owner_ref === c.ref && d.in_app);
  const hasEmail = !!(c.email||'').trim(), hasPhone = !!(c.phone||'').trim();
  const emailOn = hasEmail && ch.email !== false;
  const inappOn = inapp && (ch.inapp == null ? !hasEmail : !!ch.inapp);
  const waOn = hasPhone && !!ch.whatsapp;
  const t = (what, ok, isOn, why) => ok ? `${what}: ${isOn?'on':'off'} — click to turn ${isOn?'off':'on'}` : why;
  const chans = '<span class="seg" style="margin-left:4px">' +
    b('Email', emailOn, !hasEmail, t('Email', hasEmail, emailOn, 'No email address on file'), {channels:{email:!emailOn}}) +
    b('In-app', inappOn, !inapp, t('In-app (manage.unetwork.io chat)', inapp, inappOn, 'No licence reachable in the portal chat'), {channels:{inapp:!inappOn}}) +
    b('WA', waOn, !hasPhone, t('WhatsApp', hasPhone, waOn, 'No phone number on file'), {channels:{whatsapp:!waOn}}) +
    '</span>';
  return `<span class="pill ${st.pill}" title="${esc(st.label)}">${esc(st.key)}</span> ${master}${chans}${pend}`;
}
async function uloNotif(ref, payload){
  const c = (D.contacts||[]).find(x => x.ref === ref);
  if (!c) return;
  try {
    const s = await sbSession();
    if (!s) throw new Error('signed out — reload and sign in');
    const saved = await sbPost('actions', s, [{kind: 'contact_notifications',
      payload: Object.assign({ref}, payload), requested_by: (s.user||{}).email || null}]);
    D.pending = (D.pending||[]).concat(saved);
    const n = c.notifications = c.notifications || {};   // show it immediately; 'pending sync' until confirmed
    if (payload.resume) { n.enabled = true; n.pause_until = null; n.opt_out = {status:'none'}; c.alert_opt_out_at = null; }
    if ('enabled' in payload) n.enabled = payload.enabled;
    if (payload.channels) n.channels = Object.assign({}, n.channels || {}, payload.channels);
    render();
  } catch(e) { alert('Could not queue the change: ' + e.message); }
}

/* Delete a ULO (Darren, 2026-09-04): queues a contact_delete action. The
   collector refuses it while the ULO still holds a LEASED licence — reclaim
   or delete those devices first — so the confirm box says so up front and
   only offers the button when the delete can succeed. Two clicks, on purpose. */
function showUloDeleteConfirm(ref){
  const c = (D.contacts||[]).find(x => x.ref === ref);
  const box = document.getElementById('uDelBox'); if (!c || !box) return;
  const owned = (D.devices||[]).filter(d => d.owner_ref === ref);
  const leased = owned.filter(d => d.pool_status === 'leased');
  const spare = owned.length - leased.length;
  const who = esc(c.name || c.full_name || ref);
  box.innerHTML = `<div class="dangerbox">
    <b>Delete ${who} (${esc(ref)})?</b>
    ${leased.length ? `<p style="margin:6px 0"><b>Not yet.</b> ${who} still holds ${leased.length} leased licence${leased.length>1?'s':''}
        (${leased.map(d => esc(d.our_alias || d.alias || shortId(d.license_key))).join(', ')}). Open each device and use
        <i>Delete &amp; clean up</i> (or let a reclaim run its course) first — the collector refuses to delete a ULO with a live licence,
        so nobody loses one by accident.</p>` : `On the next collector run this will:
    <ul style="margin:6px 0 8px 18px;padding:0">
      <li>remove the contact record from the CRM and the dashboard (and their portal group on manage.unetwork.io);</li>
      ${spare ? `<li>set their ${spare} unactivated / available licence${spare>1?'s':''} back to <b>unassigned</b>;</li>` : ''}
      <li>stop every alert to them; keep one History row with the ref, time, who and why — no personal data.</li>
    </ul>
    <label class="field" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="uDelErase" style="width:auto">
      <span style="margin:0;text-transform:none;font-weight:400;font-size:13px;color:var(--text-primary)">GDPR erasure request — also purge their messages from the Outbox</span></label>
    <label class="field"><span>Reason (optional, goes in the log)</span><input id="uDelReason" maxlength="160" placeholder="e.g. operator left / duplicate record / erasure request"></label>
    <div class="toolbar">
      <button class="themebtn danger" id="uDelGo" onclick="queueUloDelete('${esc(ref)}')">Yes — delete this ULO</button>
      <button class="themebtn" onclick="document.getElementById('uDelBox').innerHTML=''">Cancel</button>
    </div><div id="uDelMsg" class="muted" style="margin-top:8px"></div>`}
    ${leased.length ? `<div class="toolbar"><button class="themebtn" onclick="document.getElementById('uDelBox').innerHTML=''">Close</button></div>` : ''}
    </div>`;
}
async function queueUloDelete(ref){
  const btn = document.getElementById('uDelGo'); if (btn) btn.disabled = true;
  const msg = document.getElementById('uDelMsg');
  try {
    const s = await sbSession();
    if (!s) throw new Error('signed out — reload and sign in');
    const saved = await sbPost('actions', s, [{kind: 'contact_delete',
      payload: {ref, reason: (document.getElementById('uDelReason')||{}).value?.trim() || '',
                erase: !!(document.getElementById('uDelErase')||{}).checked},
      requested_by: (s.user||{}).email || null}]);
    D.pending = (D.pending||[]).concat(saved);
    render();
    if (msg) msg.innerHTML = `<b>Queued ✓</b> — the collector removes the record on its next run (within 30 minutes).
      <button class="themebtn" onclick="runCollector(this)">Run now</button> <span class="muted">makes that ~2–3 minutes.</span>`;
    const del = document.getElementById('uDel'); if (del) del.replaceWith(Object.assign(document.createElement('span'), {className:'pill off', textContent:'deletion queued'}));
  } catch(e) {
    if (btn) btn.disabled = false;
    if (msg) msg.textContent = 'Could not queue the deletion: ' + e.message;
  }
}

/* ---------- manual licence issue (Darren, 2026-08-30) ----------
   The form queues a `manual_issue` action; the collector validates it,
   routes it through the SAME issuing path as website enquiries (pool pick,
   mint, contact register/attach, optional welcome email, Outbox row), and
   the codes appear on the dashboard when the run lands. */
function showIssueForm(ref){
  const opt = (v, l) => `<option value="${esc(v)}"${v === (ref || '') ? ' selected' : ''}>${esc(l)}</option>`;
  openModal('Issue licences', 'mint lease codes — to an existing ULO or a new contact',
    `<label class="field"><span>Assign to</span>
       <select id="iRef" onchange="issueRefChanged()">${opt('', '— new contact —')}
         ${(D.contacts||[]).map(c => opt(c.ref, `${c.name || c.full_name || c.ref} (${c.ref})`)).join('')}</select></label>
     <div class="grid2">
       <label class="field"><span>Name</span><input id="iName" placeholder="Full name — must match their contract details" maxlength="80"></label>
       <label class="field"><span>Email</span><input id="iEmail" type="email" placeholder="required for a new contact" maxlength="120"></label>
       <label class="field"><span>Phone <span class="muted">(optional)</span></span><input id="iPhone" placeholder="+44…" maxlength="20"></label>
       <label class="field"><span>Device type</span><select id="iType">
         <option value="android">Android</option><option value="ios">iOS</option>
         <option value="mixed">Both / a mix</option></select></label>
       <label class="field"><span>Licences</span><select id="iCount">${[1,2,3,4,5].map(n => `<option>${n}</option>`).join('')}</select></label>
       <label class="field"><span>Notes <span class="muted">(optional)</span></span><input id="iNotes" maxlength="200"></label>
     </div>
     <label class="field" style="flex-direction:row;align-items:center;gap:8px">
       <input type="checkbox" id="iSend" checked style="width:auto">
       <span>Send the welcome email with the codes <span class="muted">(untick to hand the codes over yourself — they appear here either way)</span></span></label>
     <div class="muted" style="font-size:12px">Standard terms: 12 months · 50% share · 50% min uptime, from the clean
       available pool. Codes not activated within ${(D.expiry||{}).expire_days || 14} days are reclaimed automatically.</div>
     <div class="toolbar" style="margin-top:14px">
       <button class="themebtn" id="iGo" onclick="submitIssue()">Queue issue</button>
     </div>
     <div id="iMsg" class="muted" style="margin-top:8px"></div>`);
  issueRefChanged();
}
function issueRefChanged(){
  const ref = document.getElementById('iRef').value;
  const c = (D.contacts||[]).find(x => x.ref === ref);
  const set = (id, v, dis) => { const el = document.getElementById(id); el.value = v; el.disabled = dis; };
  if (c) { set('iName', c.name || c.full_name || '', true); set('iEmail', c.email || '', true); set('iPhone', c.phone || '', true); }
  else { set('iName', '', false); set('iEmail', '', false); set('iPhone', '', false); }
}
async function submitIssue(){
  const ref = document.getElementById('iRef').value;
  const email = document.getElementById('iEmail').value.trim();
  const name = document.getElementById('iName').value.trim();
  const send = document.getElementById('iSend').checked;
  const msg = document.getElementById('iMsg');
  if (!ref && !email) { msg.textContent = 'A new contact needs an email address.'; return; }
  if (!ref && !name) { msg.textContent = 'A new contact needs a name (it must match their contract details).'; return; }
  if (send && !email) { msg.textContent = 'This ULO has no email on file — untick the welcome-email box or add one to their record first.'; return; }
  const payload = {
    count: Number(document.getElementById('iCount').value),
    phone_type: document.getElementById('iType').value,
    send_email: send,
    notes: document.getElementById('iNotes').value.trim(),
  };
  if (ref) payload.ref = ref;
  else Object.assign(payload, {name, email,
    phone: document.getElementById('iPhone').value.trim()});
  const btn = document.getElementById('iGo'); btn.disabled = true;
  try {
    const s = await sbSession();
    if (!s) throw new Error('signed out — reload and sign in');
    const saved = await sbPost('actions', s, [{kind: 'manual_issue', payload,
      requested_by: (s.user||{}).email || null}]);
    D.pending = (D.pending||[]).concat(saved);
    render();   // the ULOs toolbar shows the queued count immediately
    msg.innerHTML = `<b>Queued ✓</b> — the collector validates it and mints the code(s) on its
      next run (within 30 minutes). <button class="themebtn" onclick="runCollector(this)">Run now</button>
      <span class="muted">makes that ~2–3 minutes.</span>`;
  } catch(e) {
    btn.disabled = false;
    msg.textContent = 'Could not queue the issue: ' + e.message;
  }
}
async function runCollector(btn){
  if (btn) { btn.disabled = true; btn.textContent = 'Starting…'; }
  try {
    const s = await sbSession();
    if (!s) throw new Error('signed out — reload and sign in');
    const r = await fetch('/api/run-collector', {method: 'POST',
      headers: {'x-sb-token': s.access_token}});
    const txt = await r.text();
    if (!r.ok) throw new Error(txt || ('HTTP ' + r.status));
    if (btn) btn.textContent = 'Collector started ✓';
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Run now'; }
    alert('Could not start the collector: ' + e.message);
  }
}

</div>

 rewards(){
  const R = D.rewards;
  const byKey = Object.fromEntries((D.devices||[]).map(d=>[d.license_key,d]));
  const rows = (D.allocs||[]).map(r=>{
    const d = byKey[r.lic]||{};
    return {day:r.d, lic:r.lic, node:r.node, ups:(r.a||0)/1e6,
            alias:d.our_alias||d.alias||shortId(r.lic||'?'),
            owner:(d.owner_ref&&d.owner_ref!=='UNASSIGNED')?d.owner_ref:'',
            owner_name:d.owner_ref==='MARKETPLACE'?'Marketplace':(d.owner_name||'')};
  });
  const owners = [...new Map(rows.filter(r=>r.owner).map(r=>[r.owner, r.owner_name||r.owner])).entries()]
    .sort((a,b)=>String(a[1]).localeCompare(String(b[1])));
  const devsAll = [...new Map(rows.map(r=>[r.lic, r.alias])).entries()];
  const devOpts = (REW.ulo ? devsAll.filter(([k])=>(byKey[k]||{}).owner_ref===REW.ulo) : devsAll)
    .sort((a,b)=>String(a[1]).localeCompare(String(b[1])));
  const cut = REW.days ? new Date(Date.now()-REW.days*864e5).toISOString().slice(0,10) : '';
  const f = rows.filter(r=>(!REW.ulo||r.owner===REW.ulo)&&(!REW.dev||r.lic===REW.dev)&&(!cut||r.day>=cut));
  const byDay = {};
  f.forEach(r=>byDay[r.day]=(byDay[r.day]||0)+r.ups);
  const daysList = Object.keys(byDay).sort();
  const series = daysList.map(d=>({day:d, v:byDay[d]}));
  const total = f.reduce((a,r)=>a+r.ups,0);
  const span = daysList.length ? `${daysList[0]} → ${daysList[daysList.length-1]}` : '—';
  const tbtn = (n,l)=>`<button class="themebtn${REW.days===n?' seg-on':''}" style="${REW.days===n?'font-weight:700;border-color:var(--accent)':''}"
      onclick="REW.days=${n===null?'null':n};render()">${l}</button>`;
  const filters = `<div class="toolbar" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">
    <select onchange="REW.ulo=this.value;REW.dev='';render()">
      <option value="">All ULOs</option>
      ${owners.map(([r,n])=>`<option value="${esc(r)}"${REW.ulo===r?' selected':''}>${esc(n)} (${esc(r)})</option>`).join('')}
    </select>
    <select onchange="REW.dev=this.value;render()">
      <option value="">All devices</option>
      ${devOpts.map(([k,a])=>`<option value="${esc(k)}"${REW.dev===k?' selected':''}>${esc(a)}</option>`).join('')}
    </select>
    ${tbtn(7,'7d')}${tbtn(30,'30d')}${tbtn(90,'90d')}${tbtn(null,'All')}
  </div>`;
  const winTiles = [
    ['Earned in window', total.toFixed(6), 'UPS · '+span],
    ['Days with rewards', fmt(daysList.length), 'in the window'],
    ['Avg per rewarded day', daysList.length?(total/daysList.length).toFixed(6):'—', 'UPS'],
    ['Allocations', fmt(f.length), 'rows shown'],
  ].map(([k,v,s])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  const alloCols = [
    {h:'Day', f:r=>r.day},
    {h:'Device', f:r=>`<button class="linkcell" onclick="showDevice('${esc(r.lic)}')">${esc(r.alias)}</button>`},
    {h:'ULO', f:r=>r.owner?uloLink(r.owner, r.owner_name):'<span class="muted">unassigned</span>'},
    {h:'Node', f:r=>`<code>${esc((r.node||'').slice(0,12))}…</code>`},
    {h:'UPS', cls:'num', f:r=>r.ups.toFixed(6)},
  ];
  const recent = f.slice().sort((a,b)=>b.day.localeCompare(a.day)).slice(0,120);
  /* Per-LICENCE lifetime totals (the per-node view was meaningless —
     one node spans ~200 licences and many owners). */
  const cut30 = new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const byLicTot = {};
  rows.forEach(r=>{
    const t = (byLicTot[r.lic] ??= {lic:r.lic, alias:r.alias, owner_name:r.owner_name, owner:r.owner, ups:0, u30:0, allocations:0});
    t.ups += r.ups; t.allocations++; if (r.day>=cut30) t.u30 += r.ups;
  });
  const licTotals = Object.values(byLicTot).sort((a,b)=>b.ups-a.ups);
  const nodeCols = [
    {h:'Licence', f:r=>`<button class="linkcell" onclick="showDevice('${esc(r.lic)}')">${esc(r.alias)}</button>`},
    {h:'ULO', f:r=>r.owner?uloLink(r.owner, r.owner_name):'<span class="muted">unassigned</span>'},
    {h:'UPS 30d', cls:'num', f:r=>r.u30.toFixed(6)},
    {h:'UPS all-time', cls:'num', f:r=>r.ups.toFixed(6)},
    {h:'Allocations', cls:'num', f:r=>fmt(r.allocations)},
  ];
  const tiles = [
    ['Balance', fmt(R.balance_ups,3),'UPS available'],
    ['Lifetime earned', fmt(R.summary_ups?.total_ups,3),'UPS'],
    ['Last 7 days', fmt(R.summary_ups?.last7Days_ups,3),'UPS'],
    ['Today', fmt(R.summary_ups?.today_ups,3),'UPS'],
  ].map(([k,v,s])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  return `<div class="tiles">${tiles}</div>
   <div class="card"><h2>Rewards explorer</h2>
   <p class="muted" style="margin-top:-4px">Every allocation the portal has issued, per licence per day — filter by ULO, then device, then timeframe. The collector pages back through the full history, so this is complete from the first allocation onwards.</p>
   ${filters}
   <div class="tiles" style="margin:10px 0">${winTiles}</div>
   ${dayChart(series)}
   ${table('allotab', alloCols, recent)}
   ${f.length>120?`<p class="muted">Showing the 120 most recent of ${fmt(f.length)} allocations in this window.</p>`:''}</div>
   <div class="card"><h2>Earnings by licence (${R.ledger_rows||0} allocations, complete history)</h2>
   ${table('rewtab', nodeCols, licTotals)}</div>`;
 },

 revocations(){
  const q = (D.revocations && D.revocations.queue) || [];
  const by = s => q.filter(e => e.status === s);
  const pending = by('pending_approval'), approved = by('approved');
  const tiles = [
    ['Awaiting approval', pending.length, 'nothing revoked without your OK'],
    ['Approved, queued', approved.length, 'will execute on next run'],
    ['Executed', by('executed').length, 'licences reclaimed'],
    ['Cancelled', by('cancelled').length, 'came back online'],
  ].map(([k,v,s])=>`<div class="tile"><div class="k">${k}</div><div class="v">${fmt(v)}</div><div class="s">${s}</div></div>`).join('');
  const cols = [
    {h:'Licence', f:r=>esc(r.alias || r.license_key.slice(0,14)+'…')},
    {h:'Owner', f:r=>r.owner_ref||r.owner_name?uloLink(r.owner_ref, r.owner_name):'<span class="muted">unlinked</span>'},
    {h:'Days offline', cls:'num', f:r=>fmt(Math.round(r.days_offline||0))},
    {h:'Last seen', cls:'num', f:r=>ago(r.last_seen)},
    {h:'Status', f:r=>{const m={pending_approval:'wait',approved:'wait',executed:'off',cancelled:'on',declined:'on',failed:'off'};
      return `<span class="pill ${m[r.status]||'wait'}">${esc(r.status.replace('_',' '))}</span>`}},
    {h:'Approved by', f:r=>esc(r.approved_by||'—')},
    {h:'Decision', f:r=>{
      if (r.status !== 'pending_approval') return '<span class="muted">—</span>';
      if (pendingRevKeys().has(r.license_key)) return '<span class="pill wait">queued</span>';
      if (REVCONFIRM === r.license_key + 'approve')
        return `<button class="themebtn" style="color:var(--bad)" onclick="revAction('${r.license_key}','approve')">Confirm reclaim?</button>
                <button class="themebtn" onclick="REVCONFIRM=null;render()">Cancel</button>`;
      if (REVCONFIRM === r.license_key + 'decline')
        return `<button class="themebtn" onclick="revAction('${r.license_key}','decline')">Confirm decline?</button>
                <button class="themebtn" onclick="REVCONFIRM=null;render()">Cancel</button>`;
      return `<button class="themebtn" onclick="REVCONFIRM='${r.license_key}approve';render()">Approve</button>
              <button class="themebtn" onclick="REVCONFIRM='${r.license_key}decline';render()">Decline</button>`;}},
  ];
  const threshold = (D.revocations && D.revocations.threshold_days) || 30;
  return `<div class="tiles">${tiles}</div>
  <div class="warnbox"><b>Approval required.</b> Licences offline ${threshold}+ days are queued here.
  Nothing is revoked until you approve it, and an approved licence that comes back online before
  execution is cancelled automatically. Execution is additionally gated by <code>REVOKE_ENABLED</code>,
  which is currently <b>${D.revoke_enabled ? 'ON' : 'OFF (dry-run)'}</b>.
  <b>Approve</b> and <b>Decline</b> are live: each asks you to confirm, then queues the decision under your
  login — the collector applies it within 30 minutes and the row records who decided.</div>
  ${q.length ? `<div class="card">${table('revtab', cols, q)}</div>`
             : '<div class="card"><p class="muted">No revocation candidates. Every leased licence has been seen within '+threshold+' days.</p></div>'}`;
 },

 system(){

    ['Licence records', fmt(L.total), `${D.unlinked} unlinked from CRM`],

  ];
  return `${stale?`<div class="warnbox"><b>Collector may be stale.</b> Last data point is ${freshMin} minutes old; the schedule is every 30 minutes. Check the <code>collect</code> workflow — a failed session refresh is the usual cause (see docs/RESTORE.md).</div>`:''}
  <div class="card"><h2>System status</h2><table>
   ${rows.map(([k,v,s])=>`<tr><td class="sec">${k}</td><td><b>${v}</b></td><td class="muted">${s}</td></tr>`).join('')}

     {h:'When', f:r=>new Date(r.ts).toLocaleString('en-GB')},
     {h:'Event', f:r=>esc(r.event)},
     {h:'Licence', f:r=>{const l=D.licences.licenses.find(x=>x.license_key===r.license_key); return esc(l?.alias||r.license_key.slice(0,14)+'…')}},
     {h:'From', cls:'num', f:r=>esc(r.from ?? '—')},
     {h:'To', cls:'num', f:r=>esc(r.to ?? r.status ?? '—')},
   ], D.events.slice().reverse().slice(0,60))}</div>`;

 monitoring(){
  const H = D.health || {}, HC = H.components || {}, F = H.facts || {};
  const rank = {green:0, amber:1, red:2};
  const worst = (...s) => s.filter(Boolean).reduce((a,b)=>rank[b]>rank[a]?b:a,'green');
  const fresh = m => m==null ? 'red' : m<45 ? 'green' : m<90 ? 'amber' : 'red';
  const ageM = iso => iso ? Math.max(0, Math.round((Date.now()-new Date(iso))/60000)) : null;
  const agoM = m => m==null ? 'never' : m<1 ? 'just now' : m<120 ? m+' min ago'
    : m<2880 ? (m/60).toFixed(1)+' h ago' : Math.round(m/1440)+' days ago';

  /* Client-side freshness is the authority: a dead collector cannot update
     its own health snapshot, so the age of the mirrored data — refreshed by
     this page every two minutes — is what turns things red here. */
  const fleetAge = ageM(MON.fleet_ts || (D.aggregate.length ? D.aggregate[D.aggregate.length-1].ts : null));
  const dataAge = ageM(D.licences.updated_at);
  const rewAge = ageM(D.rewards.updated_at);
  const snapAge = ageM(H.evaluated_at);
  const snapStale = snapAge == null || snapAge >= 90;

  const c = {};
  c.collector = {t:'Collector', sub:'GitHub Actions · every 30 min',
    status: worst(fresh(fleetAge), snapStale ? 'green' : (HC.collector||{}).status),
    rows: [['newest data', agoM(fleetAge)], ['last health check', agoM(snapAge)],
           ['licences seen', fmt(D.licences.total)]]};
  /* Inside the run: each optional module is a stage; one that fails is
     skipped so the rest still runs. The health check turns this amber on
     any skip, with the error — a silent skip never emails, so this card
     is where you see it. */
  const sk = F.stages_skipped || {}, skN = Object.keys(sk);
  c.stages = {t:'Collector stages', sub:'the modules inside each run',
    status: snapStale ? 'amber' : ((HC.stages||{}).status || 'amber'),
    rows: [['ran', fmt((F.stages_ran||[]).length)],
           ['skipped', skN.length ? skN.map(k => k + ' — ' + (sk[k]||'?')).join('; ') : 'none'],
           ['not reached', (F.stages_not_reached||[]).length ? F.stages_not_reached.join(', ') : 'none'],
           ['problems reported', Object.keys(F.stages_warnings||{}).length
              ? Object.entries(F.stages_warnings).map(([k,v]) => k + ' — ' + v.join(' | ')).join('; ') : 'none'],
           ['verdict', snapStale ? 'no recent health data' : ((HC.stages||{}).detail||'—')]]};
  const dispAge = ageM(F.scheduler_last_dispatch);
  c.scheduler = {t:'Scheduler', sub:'your VPS fires the runs · cron :00/:30',
    status: dispAge==null ? 'amber' : fresh(dispAge),
    rows: [['last VPS trigger', dispAge==null
             ? ((HC.scheduler||{}).detail || 'no health data yet') : agoM(dispAge)],
           ['GitHub cron', 'sporadic backup only']]};
  c.unity = {t:'Unity portal session', sub:'manage.unetwork.io',
    status: snapStale ? worst('amber', fresh(fleetAge)) : (HC.unity_session||{}).status,
    rows: [['token refresh', snapStale ? 'no recent health data' : ((HC.unity_session||{}).detail||'—')]]};
  c.supabase = {t:'Supabase', sub:'database · auth · this page reads it live',
    status: MON.err ? 'red' : 'green',
    rows: [['reachable', MON.err ? MON.err : 'yes — this page is live'],
           ['mirror current to', agoM(fleetAge)]]};
  const sites = (F.netlify_sites||[]).map(s2 =>
    [s2.domain||s2.name, (s2.state||'?') + ' · ' + agoM(ageM(s2.published_at))]);
  c.netlify = {t:'Netlify', sub:'both sites · deploys and usage',
    status: snapStale ? 'amber' : (HC.netlify||{}).status,
    rows: sites.length ? sites.concat([['usage', (F.netlify_usage_exceeded||[]).length ? 'EXCEEDED' : 'within allowance']])
                       : [['status', snapStale ? 'no recent health data' : ((HC.netlify||{}).detail||'—')]]};
  c.data = {t:'Data freshness', sub:'what every tab is showing you',
    status: worst(fresh(dataAge), fresh(rewAge)),
    rows: [['licences', agoM(dataAge)], ['rewards', agoM(rewAge)],
           ['enquiries checked', agoM(ageM(F.enquiries_checked_at))]]};
  const al = D.alias_sync || {};
  c.alias = {t:'Alias sync', sub:'our names pushed to the portal',
    status: (al.failed||[]).length ? 'red'
      : ((al.pending||[]).length || (al.needs_review||[]).length) ? 'amber' : 'green',
    rows: [['pending', fmt((al.pending||[]).length)],
           ['applied last run', fmt((al.applied_this_run||[]).length)],
           ['needs review (owner conflict)', fmt((al.needs_review||[]).length)],
           ['failed', fmt((al.failed||[]).length)],
           ['writing to portal', al.enabled ? 'yes' : 'dry-run only']]};
  const q = (D.revocations||{}).queue || [];
  const await_ = q.filter(r => r.status==='pending_approval' || r.status==='proposed').length;
  c.revocations = {t:'Revocation queue', sub:'nothing executes without your OK',
    status: await_ ? 'amber' : 'green',
    rows: [['awaiting approval', fmt(await_)],
           ['executed all-time', fmt(q.filter(r=>r.status==='executed').length)]]};
  const cutoff = Date.now() - 14*864e5;
  const recentNew = D.pipeline.filter(e => e.status==='new' && new Date(e.received_at) > cutoff).length;
  c.enquiries = {t:'Enquiries', sub:'website contact form · auto-imported',
    status: recentNew ? 'amber' : 'green',
    rows: [['new, last 14 days', fmt(recentNew)],
           ['open in pipeline', fmt(D.pipeline.filter(e=>e.status==='new').length)]]};
  c.email = {t:'Email alerts', sub:'Graph sendMail as cos@ · SendMail app',
    status: snapStale ? 'amber' : (HC.email_alerts||{}).status,
    rows: [['credential', snapStale ? 'no recent health data'
                                    : ((HC.email_alerts||{}).detail||'—')],
           ['safety net', 'GitHub failure email']]};

  const all = Object.values(c);
  const overall = worst(...all.map(x=>x.status));
  const green = all.filter(x=>x.status==='green').length;
  const wd = (D.watchdog_state||{}).alerted || {};
  const wdStatus = Object.keys(wd).length ? 'red' : 'green';

  const head = {green:'Everything is healthy', amber:'Mostly healthy — amber needs a look this week',
                red:'Something is red — fix it now'}[overall];

  const sc = {green:'var(--good)', amber:'var(--warn)', red:'var(--bad)'};
  const box = (x,y,w,h,title,sub,st) =>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="var(--surface-2)"
      stroke="${st?sc[st]:'var(--border)'}" stroke-width="${st?2:1.4}"/>
    ${st?`<circle cx="${x+w-13}" cy="${y+14}" r="4.5" fill="${sc[st]}"/>`:''}
    <text x="${x+12}" y="${y+22}" font-size="13" font-weight="700" fill="var(--text-primary)">${title}</text>
    <text x="${x+12}" y="${y+38}" font-size="10.5" fill="var(--text-muted)">${sub}</text>`;
  const wire = (x1,y1,x2,y2) =>
    `<path d="M${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}"
      fill="none" stroke="var(--border)" stroke-width="1.5"/>`;
  const diagram = `<svg viewBox="0 0 960 352" style="width:100%;min-width:860px;display:block">
    ${wire(170,206,230,106)} ${wire(170,206,230,306)}

const ACTOR_LABEL = {'collector':'collector (diff)', 'collector:groups':'group sync', 'collector:expiry':'14-day expiry',
  'collector:onboard':'onboarding', 'collector:revoke':'reclaim'};
function actorCell(a){
  if (!a) return '<span class="muted">—</span>';
  if (a.includes('@')) return `<span title="signed-in dashboard user">${esc(a)}</span>`;
  const base = a.split(' (')[0];
  return `<span class="muted" title="${esc(a)}">⚙ ${esc(ACTOR_LABEL[base] || a)}</span>`;
}
function entityLink(entity, id){
  if (!id) return '<span class="muted">—</span>';
  if (entity === 'ulo') {
    const c = (D.contacts||[]).find(x => x.ref === id);
    return c ? uloLink(id, c.name || c.full_name) : `<span class="mono" title="no longer a ULO">${esc(id)}</span>`;
  }
  if (entity === 'device' || entity === 'licence') {
    const d = (D.devices||[]).find(x => x.license_key === id);
    return d ? `<button class="linkcell" onclick="showDevice('${esc(id)}')">${esc(d.our_alias || d.alias || shortId(id))}</button> <span class="muted mono">${esc(shortId(id))}</span>`
             : `<span class="mono">${esc(shortId(id))}</span>`;
  }
  return esc(id);
}
function changeCell(a){
  const b = a.before || {}, f = a.after || {};
  const keys = [...new Set([...Object.keys(b), ...Object.keys(f)])];
  if (!keys.length) return '<span class="muted">—</span>';
  const v = x => x == null || x === '' ? '<span class="muted">∅</span>' : esc(Array.isArray(x) ? x.join(', ') : String(x));
  return `<div class="chg">` + keys.map(k =>
    `<b>${esc(k)}</b>: ${b[k] === undefined ? '' : `<s>${v(b[k])}</s> → `}<i>${v(f[k])}</i>`).join('<br>') + `</div>`;
}
function applyAuditFilters(){
  const q = (document.getElementById('audq')||{}).value?.toLowerCase() || '';
  const ent = (document.getElementById('audent')||{}).value || '';
  const who = (document.getElementById('audwho')||{}).value || '';
  const rows = D.audit || [];
  const tb = document.getElementById('audtab'); if (!tb) return;
  let shown = 0;
  [...tb.tBodies[0].rows].forEach((tr, i) => {
    const a = rows[i]; if (!a) return;
    const ok = (!ent || a.entity === ent)
      && (!who || (who === 'person' ? (a.actor||'').includes('@') : !(a.actor||'').includes('@')))
      && (!q || tr.innerText.toLowerCase().includes(q));
    tr.style.display = ok ? '' : 'none'; if (ok) shown++;
  });
  const c = document.getElementById('audcount'); if (c) c.textContent = `${shown} of ${rows.length}`;
}

/* ---------- Social (Facebook content pool) ---------- */
const postPill = st => `<span class="pill ${st==='posted'||st==='approved'?'on':st==='failed'?'off':'wait'}">${esc(st)}</span>`;
/* One source post becomes one row per platform (fb-/x-/ig- ids); each row
   is approved, posted and retired on its own. */
const PLATFORM_LABEL = {facebook:'Facebook', x:'X', instagram:'Instagram'};
const platformOf = r => r.platform || 'facebook';
const platformPill = r => `<span class="pill ${platformOf(r)==='facebook'?'on':platformOf(r)==='x'?'wait':'off'}" style="color:var(--text-primary);background:var(--surface-2)">${esc(PLATFORM_LABEL[platformOf(r)]||platformOf(r))}</span>`;
const postLink = r => platformOf(r)==='facebook' ? `https://www.facebook.com/${encodeURIComponent(r.post_id||'')}`
                    : platformOf(r)==='x' ? `https://x.com/i/web/status/${encodeURIComponent(r.post_id||'')}`
                    : 'https://www.instagram.com/';
const siblingsOf = r => (D.social||[]).filter(x => x.id.split('-').slice(1).join('-') === r.id.split('-').slice(1).join('-'));
function applySocialFilters(){
  const q = (document.getElementById('socq')||{}).value?.toLowerCase() || '';
  const st = (document.getElementById('socst')||{}).value || '';
  const pf = (document.getElementById('socpf')||{}).value || '';
  const rows = D.social || [];
  const tb = document.getElementById('soctab'); if (!tb) return;
  let shown = 0;
  [...tb.tBodies[0].rows].forEach((tr, i) => {
    const r = rows[i]; if (!r) return;
    const ok = (!st || r.status === st) && (!pf || platformOf(r) === pf) && (!q || (r.body||'').toLowerCase().includes(q) || (r.topic||'').includes(q) || r.id.includes(q));
    tr.style.display = ok ? '' : 'none'; if (ok) shown++;
  });
  const c = document.getElementById('soccount'); if (c) c.textContent = `${shown} of ${rows.length}`;
}
function showPost(id){
  const r = (D.social||[]).find(x => x.id === id); if (!r) return;
  const meta = [['Platform', platformPill(r)], ['Status', postPill(r.status)], ['Topic', dval(r.topic)],
    ['Approved', r.approved_at ? `${esc(r.approved_at.slice(0,16).replace('T',' '))} by ${esc(r.approved_by||'?')}` : dval(null)],
    ['Posted', r.posted_at ? `${esc(r.posted_at.slice(0,16).replace('T',' '))} · <a class="linkcell" href="${postLink(r)}" target="_blank" rel="noopener">open on ${esc(PLATFORM_LABEL[platformOf(r)]||'the platform')}</a>` : dval(null)],
    ...(platformOf(r) === 'instagram' ? [['Image card', `<a class="linkcell" href="/social/${esc('fb-' + r.id.split('-').slice(1).join('-'))}.jpg" target="_blank" rel="noopener">view</a> — rendered by the collector, served from this site`]] : []),
    ['Error', dval(r.error)]];
  const editable = r.status === 'draft' || r.status === 'approved' || r.status === 'failed';

/* The house CTA is owned by collector/social.py (CTA) and baked in by
   dashboard/build.py as D.social_cta, so the tab and the poster can never
   disagree again (2026-09-09: a stale copy here rejected every Approve). */
const SOCIAL_CTA = D.social_cta || 'Get the app: worlddepin.io/app · Free licence: worlddepin.io · hello@worlddepin.io';
const SOCIAL_CTA_X = D.social_cta_x || 'Free licence + app: worlddepin.io';
const SOCIAL_CTA_IG = D.social_cta_ig || 'Free licence + app — link in bio. worlddepin.io';
const SOCIAL_MAX = D.social_max_len || {facebook: 2000, x: 280, instagram: 2200};
function rulesText(p){
  if (p === 'x') return `Must end with: <code>${esc(SOCIAL_CTA_X)}</code>, ${SOCIAL_MAX.x} characters at most (X). Earnings figures need the demand caveat.`;
  if (p === 'instagram') return `Must contain: <code>${esc(SOCIAL_CTA_IG)}</code> and end with a line of 3–5 hashtags (Instagram; links are not clickable there). Earnings figures need the demand caveat.`;
  return `Must end with: <code>${esc(SOCIAL_CTA)}</code>. Earnings figures need the demand caveat.`;
}
/* Mirrors collector/social.py house_rules(): what the poster will refuse at send time. */
function checkPostText(t, platform){
  t = (t||'').trim(); platform = platform || 'facebook';
  if (!t) return 'empty post';
  if (platform === 'x') { if (!t.endsWith(SOCIAL_CTA_X)) return 'must end with the X CTA'; }
  else if (platform === 'instagram') {
    if (!t.includes(SOCIAL_CTA_IG)) return 'must carry the Instagram CTA (link in bio)';
    if ((t.split('\n').pop().match(/#\w+/g)||[]).length < 3) return 'must end with a line of 3–5 hashtags';
  } else if (!t.endsWith(SOCIAL_CTA)) return 'must end with the CTA';
  if (t.includes('$0.10') && !/demand|not guaranteed|aren't guaranteed|isn't guaranteed/i.test(t)) return 'earnings figure without the demand caveat';
  if (t.length > (SOCIAL_MAX[platform] || 2000)) return `too long for ${PLATFORM_LABEL[platform]||platform} (${t.length} > ${SOCIAL_MAX[platform]})`;
  return null;
}

/* Just enough markdown for our own docs: headings, fenced code, tables,
   lists (with checkboxes), quotes, rules, bold/italic/inline code/links.
   Input is escaped first, so nothing in a doc can inject markup. */
var ADMIN = {doc: null};
function mdRender(src){
  const inline = s => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:)]|$)/g, '$1<i>$2</i>')
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m,a,u) =>
      /^https?:/.test(u) ? `<img src="${u}" alt="${a}">` : a)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,t,u) =>
      /^(https?:|mailto:)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t);
  const lines = esc(src).split('\n');
  const out = [];
  let para = [], list = null;
  const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.t}>` + list.items.map(x=>`<li>${x}</li>`).join('') + `</${list.t}>`); list = null; } };
  const flush = () => { flushPara(); flushList(); };
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i];
    if (/^```/.test(L)) {                                    // fenced code
      flush(); const code = [];
      while (++i < lines.length && !/^```/.test(lines[i])) code.push(lines[i]);
      out.push(`<pre><code>${code.join('\n')}</code></pre>`); continue;
    }
    const h = L.match(/^(#{1,3}) +(.*)/);
    if (h) { flush(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (L.startsWith('|') && i+1 < lines.length && /^\|[\s|:-]+\|?\s*$/.test(lines[i+1])) {
      flush();                                               // table
      const cells = r => r.replace(/^\||\|\s*$/g,'').split('|').map(c=>inline(c.trim()));
      const head = cells(L); i++;
      const rows = [];
      while (i+1 < lines.length && lines[i+1].startsWith('|')) rows.push(cells(lines[++i]));
      out.push('<table><tr>' + head.map(c=>`<th>${c}</th>`).join('') + '</tr>'
        + rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('') + '</table>');
      continue;
    }
    const li = L.match(/^([-*]|\d+\.) +(.*)/);
    if (li) {
      flushPara();
      const t = /\d/.test(li[1][0]) ? 'ol' : 'ul';
      if (!list || list.t !== t) { flushList(); list = {t, items: []}; }
      list.items.push(inline(li[2].replace(/^\[ \] /,'☐ ').replace(/^\[x\] /i,'☑ ')));
      continue;
    }
    if (list && /^\s+\S/.test(L)) { list.items[list.items.length-1] += ' ' + inline(L.trim()); continue; }
    if (/^&gt; ?/.test(L)) {                                 // blockquote (input is escaped)
      flush(); const q = [L.replace(/^&gt; ?/,'')];
      while (i+1 < lines.length && /^&gt; ?/.test(lines[i+1])) q.push(lines[++i].replace(/^&gt; ?/,''));
      out.push(`<blockquote><p>${inline(q.join(' '))}</p></blockquote>`); continue;
    }
    if (/^\s*(---+|\*\*\*)\s*$/.test(L)) { flush(); out.push('<hr>'); continue; }
    if (!L.trim()) { flush(); continue; }
    para.push(L.trim());
  }
  flush();
  return out.join('\n');
}
