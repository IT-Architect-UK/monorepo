/* ------------------------------------------------------------------- auth
   The shell carries no data. Everything — first paint included — comes from
   Supabase after sign-in, under row level security. A page that contains
   nothing cannot leak anything. */
const SB = D.supabase || {};
const SBKEY = 'wd-sb-session';
let SESSION = null, LIVE = false;

function sbLoad(){ try { return JSON.parse(localStorage.getItem(SBKEY) || 'null'); } catch(e){ return null; } }
function sbSave(s){ try { s ? localStorage.setItem(SBKEY, JSON.stringify(s)) : localStorage.removeItem(SBKEY); } catch(e){} }

async function sbAuth(body, grant){
  const r = await fetch(`${SB.url}/auth/v1/token?grant_type=${grant}`, {
    method:'POST', headers:{'apikey':SB.key,'Content-Type':'application/json'},
    body: JSON.stringify(body)});
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error_description || 'Sign in failed');
  const s = await r.json();
  s.expires_at = Date.now() + (s.expires_in - 60) * 1000;
  return s;
}

async function sbSession(){
  let s = SESSION || sbLoad();
  if (!s) return null;
  if (Date.now() > (s.expires_at || 0)) {
    try { s = await sbAuth({refresh_token: s.refresh_token}, 'refresh_token'); }
    catch(e) { sbSave(null); return null; }
    sbSave(s);
  }
  SESSION = s; return s;
}

async function sbGet(path, s, range){
  const h = {'apikey':SB.key,'Authorization':`Bearer ${s.access_token}`};
  if (range) { h['Range-Unit'] = 'items'; h['Range'] = range; }
  const r = await fetch(`${SB.url}/rest/v1/${path}`, {headers: h});
  if (!r.ok) throw new Error(`${path.split('?')[0]}: HTTP ${r.status}`);
  return r.json();
}

async function sbPost(path, s, body){
  const r = await fetch(`${SB.url}/rest/v1/${path}`, {method: 'POST',
    headers: {'apikey': SB.key, 'Authorization': `Bearer ${s.access_token}`,
              'Content-Type': 'application/json', 'Prefer': 'return=representation'},
    body: JSON.stringify(body)});
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function sbPatch(path, s, body){
  const r = await fetch(`${SB.url}/rest/v1/${path}`, {method: 'PATCH',
    headers: {'apikey': SB.key, 'Authorization': `Bearer ${s.access_token}`,
              'Content-Type': 'application/json', 'Prefer': 'return=representation'},
    body: JSON.stringify(body)});
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

/* Supabase caps any single response at 1,000 rows, silently. With 1,350
   licences that truncation looked like data, not an error — so every table
   is paged until a short page says we have it all. */
async function sbAll(path, s){
  const out = [];
  for (let from = 0;; from += 1000) {
    const page = await sbGet(path, s, `${from}-${from + 999}`);
    out.push(...page);
    if (page.length < 1000) return out;
  }
}

const num = (v) => v == null || v === '' ? null : Number(v);
const days = (iso) => iso ? Math.round((Date.now() - new Date(iso)) / 864e5) : null;

/* Rebuild the D the views were written against, from live rows. */
function assemble(t){
  const snaps = Object.fromEntries(t.snapshots.map(r => [r.key, r.data]));
  D.rewards = snaps.rewards || {};
  D.allocs = (snaps.rewards_allocations || {}).rows || [];
  /* Portal-computed windowed metrics per licence (uptime 7d, UPS windows). */
  D.perf = Object.fromEntries((((snaps.license_perf || {}).rows) || []).map(r => [r.lic, r]));
  /* Daily uptime history by licence (last 60d, leased licences only). */
  D.uptime = {};
  for (const r of (t.uptime || [])) (D.uptime[r.license_key] ??= []).push(r);
  /* The portal's own per-day uptime series (license_analytics RPC) —
     preferred over our once-a-day snapshots wherever present. */
  const LD = snaps.license_daily || {};
  D.daily = {};
  for (const [lic, arr] of Object.entries(LD.series || {}))
    D.daily[lic] = arr.map(([day, pct]) => ({day, uptime_pct: pct}));
  D.dailySince = LD.since || null;
  D.messaging = snaps.messaging || null;
  const inappByKey = Object.fromEntries(((D.messaging||{}).recipients||[]).map(r => [r.licenseId, r]));
  D.rules = snaps.rules || {};
  D.expiry = snaps.expiry_config || {};
  D.alias_sync = snaps.alias_sync || {pending: []};
  const summary = snaps.licences_summary || {};
  const rewardsByNode = D.rewards.by_node || {};

  const byRef = Object.fromEntries(t.contacts.map(c => [c.ref, c]));
  const regByKey = Object.fromEntries(t.devices.map(d => [d.license_key, d]));

  const lics = t.licences.map(l => {
    const reg = regByKey[l.license_key] || {};
    const ref = reg.owner_ref && reg.owner_ref !== 'UNASSIGNED' && reg.owner_ref !== 'MARKETPLACE'
      ? reg.owner_ref : null;
    return Object.assign({}, l, {
      uptime_pct: num(l.uptime_pct), days_offline: num(l.days_offline),
      owner_ref: reg.owner_ref || 'UNASSIGNED',
      owner_name: reg.owner_ref === 'MARKETPLACE' ? 'Marketplace'
        : (byRef[ref] || {}).full_name || l.owner_alias || '',
      our_alias: reg.alias, alias_source: reg.alias_source, source: reg.source,
      notes: reg.notes,
      owner_kind: reg.owner_ref === 'MARKETPLACE' ? 'marketplace' : (ref ? 'crm' : 'unassigned'),
      alias_in_sync: (reg.alias || '') === (l.alias || ''),
      in_app: !!inappByKey[l.license_key],
      in_app_conv: !!(inappByKey[l.license_key]||{}).conversationId,
      age_days: days(l.last_seen),
      rewards_ups: (rewardsByNode[l.node_id] || {}).ups || 0,
    });
  });

  const contacts = t.contacts.filter(c => !c.is_sentinel).map(c => {
    const owned = lics.filter(l => l.owner_ref === c.ref);
    return Object.assign({}, c, {
      name: c.full_name,
      licence_count: owned.length,
      online_count: owned.filter(l => l.status === 'online').length,
      avg_uptime: owned.length
        ? Math.round(owned.reduce((a,l) => a + (l.uptime_pct||0), 0) / owned.length * 10) / 10 : null,
    });
  });

  D.licences = {
    licenses: lics, total: lics.length,
    online: lics.filter(l => l.status === 'online').length,
    pools: summary.pools || {}, below_min_uptime: summary.below_min_uptime,
    updated_at: summary.updated_at || new Date().toISOString(),
  };
  D.contacts = contacts;
  D.devices = lics;
  D.pipeline = t.enquiries.map(e => Object.assign({}, e, {age_days: days(e.received_at)}));
  D.unlinked = lics.filter(l => l.owner_kind === 'unassigned').length;
  D.revocations = {queue: t.revocations};
  D.aggregate = t.fleet.slice().reverse();
  D.events = t.events.slice().reverse().map(e =>
    Object.assign({}, e, {from: e.from_value, to: e.to_value}));
  D.health = snaps.health || null;
  D.watchdog_state = snaps.watchdog_state || null;
  D.docs = snaps.docs || {};
  D.templates = t.templates || [];
  D.pending = t.pending || [];
  D.messages = t.messages || [];
  D.audit = t.audit || [];
  D.social = t.social || [];
}

function banner(kind, html){
  const el = document.getElementById('livebar');
  el.className = 'livebar ' + kind;
  el.innerHTML = html;
}

async function signIn(email, password, msgEl){
  msgEl.textContent = '';
  try {
    const s = await sbAuth({email, password}, 'password');
    sbSave(s); SESSION = s;
    await boot();
  } catch(e) { msgEl.textContent = e.message; }
}

function signOut(){ sbSave(null); SESSION = null; LIVE = false; location.reload(); }

function loginCard(msg){
  return `<div style="max-width:360px;margin:14vh auto 0">
    <div class="card"><h2>Sign in</h2>
    <form onsubmit="event.preventDefault();signIn(this.email.value,this.password.value,this.querySelector('.msg'))"
        style="display:flex;flex-direction:column;gap:10px;padding:0 14px 14px">
      <input name="email" type="email" placeholder="email" required autocomplete="username"
        style="padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:inherit;font:inherit">
      <input name="password" type="password" placeholder="password" required autocomplete="current-password"
        style="padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:inherit;font:inherit">
      <button class="themebtn" type="submit" style="padding:9px">Sign in</button>
      <span class="msg" style="color:var(--bad);min-height:1.2em">${esc(msg||'')}</span>
    </form></div></div>`;
}

async function boot(){
  if (!SB.url || !SB.key) {
    document.getElementById('app').innerHTML =
      '<p style="text-align:center;margin-top:20vh" class="muted">This build has no database configured.</p>';
    return;
  }
  const s = await sbSession();
  if (!s) { LIVE = false; render(); return; }

  banner('off', 'Loading…');
  try {
    const upCut = new Date(Date.now() - 60 * 864e5).toISOString().slice(0, 10);
    const [contacts, devices, licences, enquiries, revocations, fleet, events, snapshots, templates, pending, messages, uptime, auditRows, socialRows] =
      await Promise.all([
        sbAll('contacts?select=*&order=ref', s),
        sbAll('devices?select=*&order=license_key', s),
        sbAll('licences?select=*&order=license_key', s),
        sbAll('enquiries?select=*&order=received_at.desc', s),
        sbAll('revocations?select=*&order=proposed_at.desc', s),
        sbGet('metrics_fleet?select=*&order=ts.desc&limit=500', s),
        sbGet('metrics_events?select=*&order=ts.desc&limit=400', s),
        sbAll('snapshots?select=*&order=key', s),
        sbAll('templates?select=*&order=id', s),
        sbAll('actions?select=*&status=eq.pending&order=id', s).catch(() => []),
        sbGet('messages?select=*&order=ts.desc&limit=300', s).catch(() => []),
        sbAll(`metrics_uptime?select=day,license_key,uptime_pct,status&day=gte.${upCut}&order=day`, s).catch(() => []),
        sbGet('audit_log?select=*&order=at.desc&limit=1000', s).catch(() => []),
        sbAll('social_posts?select=*&order=created_at,id', s).catch(() => []),
      ]);

    /* Signed in but zero rows everywhere = authenticated but not staff: RLS
       filters every table to nothing for this account. Say that plainly. */
    if (!licences.length && !contacts.length && !devices.length) {
      LIVE = false; render();
      document.getElementById('app').innerHTML = loginCard(
        `${(s.user||{}).email||'This account'} has no access — it needs a staff record.`);
      banner('warn', `Signed in without access. <button class="themebtn" onclick="signOut()">Sign out</button>`);
      return;
    }
    assemble({contacts, devices, licences, enquiries, revocations, fleet, events, snapshots, templates, pending, messages, uptime, audit: auditRows, social: socialRows});
    LIVE = true;
    render();
    banner('live', `<b>Live</b> — signed in as ${esc((s.user||{}).email||'')}. `
      + `<button class="themebtn" onclick="signOut()">Sign out</button>`);
  } catch(e) {
    LIVE = false; render();
    document.getElementById('app').innerHTML = loginCard(`Could not load data: ${e.message}`);
    banner('warn', `<button class="themebtn" onclick="signOut()">Sign out</button>`);
  }
}
boot();

/* Monitoring self-refresh: a light poll (one ts + the snapshots) every two
   minutes while that tab is open, so freshness ages tick without a reload
   and a collector that dies turns red here on its own. */
const MON = {fleet_ts: null, err: null};

/* Header stamp: countdown to the next collector run (VPS fires at :00/:30)
   and the outcome of the last one. Ticks every second; the last-sync time
   and status update from the background poll. */
function updateStamp(){
  const el = document.getElementById('stamp');
  if (!el) return;
  if (!LIVE) { el.textContent = ''; return; }
  const now = Date.now();
  const half = 30 * 60 * 1000;
  const next = Math.ceil((now + 1000) / half) * half;
  const lastTs = MON.fleet_ts || (D.aggregate.length ? D.aggregate[D.aggregate.length - 1].ts : null);
  const lastMs = lastTs ? new Date(lastTs).getTime() : null;
  const ageMin = lastMs == null ? null : (now - lastMs) / 60000;
  const reds = ((D.health || {}).reds || []).length;
  const st = (ageMin == null || ageMin >= 90 || reds) ? ['✗', 'var(--bad)']
           : ageMin >= 45 ? ['⚠', 'var(--warn)'] : ['✓', 'var(--good)'];
  const left = Math.max(0, next - now);
  const mm = String(Math.floor(left / 60000)).padStart(2, '0');
  const ss = String(Math.floor(left / 1000) % 60).padStart(2, '0');
  const lastStr = lastMs == null ? 'never'
    : new Date(lastMs).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
  el.innerHTML = `next sync in <b>${mm}:${ss}</b>`
    + ` · <span style="color:${st[1]}" title="collector data is ${ageMin == null ? 'missing' : Math.round(ageMin) + ' min old'}${reds ? ' · ' + reds + ' component(s) red' : ''}">last sync ${lastStr} ${st[0]}</span>`;
}
setInterval(updateStamp, 1000);
setInterval(async () => {
  if (!LIVE) return;
  try {
    const s = await sbSession();
    if (!s) return;
    const [fleet, snaps] = await Promise.all([
      sbGet('metrics_fleet?select=ts&order=ts.desc&limit=1', s),
      sbGet('snapshots?select=*', s)]);
    if (fleet.length) MON.fleet_ts = fleet[0].ts;
    const sn = Object.fromEntries(snaps.map(r => [r.key, r.data]));
    if (sn.health) D.health = sn.health;
    if (sn.watchdog_state) D.watchdog_state = sn.watchdog_state;
    if (sn.licences_summary) D.licences.updated_at = sn.licences_summary.updated_at;
    if (sn.rewards) D.rewards.updated_at = sn.rewards.updated_at;
    if (sn.alias_sync) D.alias_sync = sn.alias_sync;
    MON.err = null;
  } catch(e) { MON.err = e.message; }
  if (active === 'monitoring') render();
  updateStamp();
}, 120000);

</script></body></html>
