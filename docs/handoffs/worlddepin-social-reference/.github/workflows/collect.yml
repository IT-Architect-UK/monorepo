name: collect
on:
  workflow_dispatch:
    inputs:
      force_news:
        description: "Bypass the six-hour news freshness gate for this run"
        type: boolean
        default: false
  schedule:
    # Every 30 min ≈ 1,440 Actions-minutes/month (inside the 2,000 free allowance
    # for private repos). "*/15" would be ~2,900/min-month and start costing.
    - cron: "*/30 * * * *"
permissions:
  contents: write
  # actions:read lets the health check ask "when did the VPS last fire a
  # run?" via the run-history API.
  actions: read
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # ref: main, not the default github.sha. A run queued behind another
      # one (GitHub's backup cron firing while a VPS-dispatched run is in
      # progress) is pinned to the commit it was CREATED against, which is one
      # collect commit stale by the time it starts; it then rewrites the same
      # data files and its push conflicts (2026-09-02 14:08: 13 files, run
      # lost, health check red on a tree full of conflict markers). Checking
      # out the tip at start time removes the race entirely.
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r collector/requirements.txt
      - name: Collect
        id: collect
        env:
          UNITY_SESSION_JSON: ${{ secrets.UNITY_SESSION_JSON }}
          SESSION_ENC_KEY: ${{ secrets.SESSION_ENC_KEY }}
          # Set repo variable REVOKE_ENABLED=true only after Darren signs off on a first live revoke.
          REVOKE_ENABLED: ${{ vars.REVOKE_ENABLED }}
          ALIAS_SYNC_ENABLED: ${{ vars.ALIAS_SYNC_ENABLED }}
          # Read-only here: used to pull worlddepin.io contact-form submissions
          # into data/pipeline.json. Absent = enquiry import is skipped.
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # Mirrors current state into Supabase alongside the JSON files. The
          # JSON stays the source of truth; set SUPABASE_SYNC_ENABLED=false to
          # stop mirroring without a deploy.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SYNC_ENABLED: ${{ vars.SUPABASE_SYNC_ENABLED }}
          # Customer email engine (offboarding ladder). Dry-run — decisions
          # recorded on the Outbox tab, nothing sent — until the repo variable
          # ULO_EMAILS_ENABLED is set to true. Sends via the same Graph app
          # as the system alerts, as each template's From address (support@).
          ULO_EMAILS_ENABLED: ${{ vars.ULO_EMAILS_ENABLED }}
          # Same switch for the portal's in-app chat channel (no-email leases).
          ULO_INAPP_ENABLED: ${{ vars.ULO_INAPP_ENABLED }}
          # WhatsApp escalation touch: the final warning also goes to a CRM
          # contact's phone via approved Meta templates. Dry-run until the
          # repo variable ULO_WHATSAPP_ENABLED is set to true.
          ULO_WHATSAPP_ENABLED: ${{ vars.ULO_WHATSAPP_ENABLED }}
          # Daily "get back online" nudges (collector/uptime_alerts.py):
          # bundled per operator after 1 h offline, again at 4 h, reset each
          # day, quiet 22:00-07:00 UK. Their OWN master switch: absent/false
          # = dry-run rows on the Outbox whatever the channel switches say.
          ULO_UPTIME_ALERTS_ENABLED: ${{ vars.ULO_UPTIME_ALERTS_ENABLED }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ vars.WHATSAPP_PHONE_ID }}
          # Single-stage enquiry onboarding: mint lease codes and email them
          # in the first reply. Off/absent = dry-run rows on the Outbox.
          ENQUIRY_AUTO_ISSUE: ${{ vars.ENQUIRY_AUTO_ISSUE }}
          # Per-holder portal groups (manage.unetwork.io). Off = log-only.
          GROUPS_SYNC_ENABLED: ${{ vars.GROUPS_SYNC_ENABLED }}
          SOCIAL_POSTING_ENABLED: ${{ vars.SOCIAL_POSTING_ENABLED }}
          # X and Instagram (collector/social.py, 2026-09-09). Each has its
          # own switch; absent = dry-run rows in the log, nothing posted.
          SOCIAL_X_ENABLED: ${{ vars.SOCIAL_X_ENABLED }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SOCIAL_INSTAGRAM_ENABLED: ${{ vars.SOCIAL_INSTAGRAM_ENABLED }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          # Reply-monitor digests go to the same recipients as system alerts.
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          GRAPH_TENANT_ID: ${{ vars.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ vars.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          # worlddepin.io/news sources. World Mobile's blog and Telegram need
          # nothing; these two unlock the projects that only announce on X or
          # in a Discord we have followed into our own server. Absent = that
          # source is skipped and the page shows a follow panel instead.
          # DISCORD_NEWS_CHANNELS = "source:channel_id[:guild_id],..."
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_NEWS_CHANNELS: ${{ vars.DISCORD_NEWS_CHANNELS }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # Empty on every scheduled run — only a manual dispatch can set it.
          NEWS_FORCE: ${{ inputs.force_news }}
        run: python collector/collect.py
      - name: Build dashboard
        env:
          REVOKE_ENABLED: ${{ vars.REVOKE_ENABLED }}
          ALIAS_SYNC_ENABLED: ${{ vars.ALIAS_SYNC_ENABLED }}
          # Baked into the page so it can offer a login and read live data.
          # Both are public by design; the secret key is never sent here.
          # Netlify's own build needs the same two, set in its site settings.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: python dashboard/build.py
      # No deploy step here on purpose. Netlify's own GitHub integration is
      # connected to this repo (site worlddepin-ops, branch main) and runs
      # `python3 dashboard/build.py` publishing `site/` on every push. A CLI
      # deploy from Actions would be a second, racing publisher of the same
      # artefact — and this one never ran anyway, as NETLIFY_SITE_ID was unset.
      - name: Commit results
        id: commit
        run: |
          git config user.name "unity-crm-bot"
          git config user.email "cos@worlddepin.io"
          git add data/ metrics/ site/ collector/session.enc
          git diff --cached --quiet || git commit -m "collect: $(date -u +%FT%TZ)"
          # If the rebase ever conflicts, abort it so the health check below
          # reads real files, not conflict markers; the step still fails and
          # the health check reports the lost run.
          git pull --rebase --autostash || { git rebase --abort || true; exit 1; }
          git push
      - name: Health check
        # Runs even when collect failed — that failure is exactly what it must
        # report. Writes the Monitoring tab's health snapshot to Supabase,
        # emails on NEW reds (when SMTP is configured, deduped to once per
        # 24h per component), then exits 1 so GitHub's own failure email is
        # the safety net delivered from outside the failing system.
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          # A run whose results never reached the repo is a failed run, even
          # when collection itself succeeded.
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          GH_API_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          GRAPH_TENANT_ID: ${{ vars.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ vars.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_SECRET_EXPIRES: ${{ vars.GRAPH_SECRET_EXPIRES }}
        run: python collector/health_check.py
